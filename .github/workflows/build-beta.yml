name: Build and Publish Beta

on:
  push:
    branches: [beta]
    paths:
      - 'Integrations/ESPHome/**'
      # A push that only changes this file must rebuild too
      - '.github/workflows/build-beta.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-beta-${{ github.ref }}
  cancel-in-progress: false

jobs:
  beta:
    permissions:
      contents: write
    uses: ApolloAutomation/Workflows/.github/workflows/build-beta.yml@main
    with:
      # Beta serves OTA only, so it builds H-3.yaml; H-3D has no OTA
      variants: >-
        [{"key": "standard", "yaml": "Integrations/ESPHome/H-3.yaml", "name": "firmware-standard"}]
      # Dispatches on other branches skip instead of building unpublished firmware
      skip-non-beta-dispatch: true
