substitutions:
  version: "26.8.26.2"

  run_duration_default: "90s"
  run_duration_gpio: "90s"
  timer_wake_enabled: "true"
  # Hold confirm after first real state
  wake_hold_confirm: "400ms"
  # Awake equivalent; must exceed 1s ceiling
  hold_gesture_length: "1.2s"

esp32:
  board: esp32-c6-devkitm-1
  variant: esp32c6
  flash_size: 8MB
  framework:
    type: esp-idf

output:
  - platform: ledc
    pin: GPIO6
    id: buzzer
    max_power: 50%

rtttl:
  id: rtttl_buzzer
  output: buzzer
  # song_active guards play_buzzer from sleeping
  on_finished_playback:
    - if:
        condition:
          - lambda: 'return id(song_active);'
        then:
          - lambda: "id(song_active) = false;"
          - script.execute: all_lights_off
          - script.execute: ShouldSleep

globals:
  - id: cycleCounter
    type: int
    restore_value: no
    initial_value: '0'
  - id: button_press_timestamp
    restore_value: no
    type: uint32_t
    initial_value: '0'
  # First boot, not yet acknowledged
  - id: runTest
    restore_value: yes
    type: bool
    initial_value: "true"
  - id: swallow_button_action
    type: bool
    restore_value: no
    initial_value: "false"
  # Set from is_playing() after play, never before
  - id: song_active
    type: bool
    restore_value: no
    initial_value: "false"
  # Which button woke us (0 = none)
  - id: wake_button
    type: uint8_t
    restore_value: no
    initial_value: '0'

deep_sleep:
  id: deep_sleep_1
  # sleep_duration set per variant, not here
  run_duration:
    default: ${run_duration_default}
    gpio_wakeup_reason: ${run_duration_gpio}
  esp32_ext1_wakeup:
    mode: ANY_HIGH
    pins:
      - number: GPIO4
        allow_other_uses: true
      - number: GPIO5
        allow_other_uses: true
      - number: GPIO7
        allow_other_uses: true

switch:
  - platform: factory_reset
    id: factory_reset_switch
    internal: true

  - platform: gpio
    pin: GPIO18
    name: "Accessory Power"
    id: accessory_power
    restore_mode: ALWAYS_ON
    setup_priority: 2000
    internal: true

button:
  - platform: factory_reset
    id: factory_reset_button
    name: "Factory Reset"
    entity_category: diagnostic
    # Exposed but off by default; avoids accidents
    disabled_by_default: true
  - platform: template
    id: btn_play_song_1
    name: "Play Song 1"
    icon: mdi:music-note
    on_press:
      then:
        - script.execute: play_song_1
  - platform: template
    id: btn_play_song_2
    name: "Play Song 2"
    icon: mdi:music-note
    on_press:
      then:
        - script.execute: play_song_2
  - platform: template
    id: btn_play_song_3
    name: "Play Song 3"
    icon: mdi:music-note
    on_press:
      then:
        - script.execute: play_song_3
  - platform: template
    id: btn_play_song_4
    name: "Play Song 4"
    icon: mdi:music-note
    on_press:
      then:
        - script.execute: play_song_4
  - platform: template
    id: btn_play_song_5
    name: "Play Song 5"
    icon: mdi:music-note
    on_press:
      then:
        - script.execute: play_song_5
  - platform: template
    id: btn_play_song_6
    name: "Play Song 6"
    icon: mdi:music-note
    on_press:
      then:
        - script.execute: play_song_6

number:
  - platform: template
    name: "Sleep Duration"
    id: deep_sleep_sleep_duration
    # 1, not 0: a 0us timer wake loops forever
    min_value: 1
    max_value: 800
    step: 1
    mode: box
    update_interval: never
    optimistic: true
    restore_value: true
    initial_value: 24
    icon: "mdi:arrow-collapse-right"
    entity_category: "config"
    unit_of_measurement: "h"
    on_value:
      then:
        - lambda: |-
            // Fires at boot too, via TemplateNumber::setup(). Both guards are
            // load-bearing: set_sleep_duration(0) arms a 0us timer wake, i.e. an
            // unrecoverable boot loop, and timer_wake_enabled is false on H-3D.
            if (${timer_wake_enabled} && x > 0) {
              id(deep_sleep_1).set_sleep_duration((uint32_t) (x * 60 * 60 * 1000));
            }

  - platform: template
    name: Volume
    id: volume_control
    min_value: 0
    max_value: 100
    initial_value: 50
    unit_of_measurement: "%"
    step: 1
    icon: "mdi:volume-high"
    entity_category: "config"
    optimistic: true
    restore_value: true
    on_value:
      - lambda: id(rtttl_buzzer).set_gain(pow(x / 100.0f, 3));

text_sensor:
  - platform: template
    id: wakeup_button_pressed
    name: "Wake-up Button Pressed"
    icon: "mdi:gesture-tap-button"
    entity_category: "diagnostic"

