substitutions:
  version: "26.8.14.1"
  run_duration_default: "90s"
  run_duration_gpio: "90s"
  timer_wake_enabled: "true"
  # Hold confirm after the button's first real state. Felt hold = boot + this.
  wake_hold_confirm: "400ms"
  # Awake equivalent. MUST exceed the 1s ON ceiling of the patterns below.
  hold_gesture_length: "1.2s"

esp32:
  board: esp32-c6-devkitm-1
  variant: esp32c6
  flash_size: 8MB
  framework:
    type: esp-idf

output:
  - platform: ledc
    pin: GPIO6
    id: buzzer
    max_power: 50%

rtttl:
  id: rtttl_buzzer
  output: buzzer
  # song_active keeps the play_buzzer API action from blanking the lights or
  # triggering a sleep.
  on_finished_playback:
    - if:
        condition:
          - lambda: 'return id(song_active);'
        then:
          - lambda: "id(song_active) = false;"
          - script.execute: all_lights_off
          - script.execute: ShouldSleep

globals:
  - id: cycleCounter
    type: int
    restore_value: no
    initial_value: '0'
  - id: button_press_timestamp
    restore_value: no
    type: uint32_t
    initial_value: '0'
  # First boot after a flash or factory reset, not yet acknowledged.
  - id: runTest
    restore_value: yes
    type: bool
    initial_value: "true"
  - id: swallow_button_action
    type: bool
    restore_value: no
    initial_value: "false"
  # Set from is_playing() AFTER each rtttl.play, never before - a malformed
  # string never starts, so a pre-set flag would strand the lights on forever.
  - id: song_active
    type: bool
    restore_value: no
    initial_value: "false"
  # Which button caused this wake (1/2/3, 0 = none).
  - id: wake_button
    type: uint8_t
    restore_value: no
    initial_value: '0'

deep_sleep:
  id: deep_sleep_1
  # sleep_duration deliberately NOT set here - H-3.yaml adds it (24h), H-3D
  # omits it so esp_sleep_enable_timer_wakeup() is never called.
  run_duration:
    default: ${run_duration_default}
    gpio_wakeup_reason: ${run_duration_gpio}
  esp32_ext1_wakeup:
    mode: ANY_HIGH
    pins:
      - number: GPIO4
        allow_other_uses: true
      - number: GPIO5
        allow_other_uses: true
      - number: GPIO7
        allow_other_uses: true

switch:
  - platform: factory_reset
    id: factory_reset_switch
    internal: true

  - platform: gpio
    pin: GPIO18
    name: "Accessory Power"
    id: accessory_power
    restore_mode: ALWAYS_ON
    setup_priority: 2000
    internal: true

button:
  - platform: factory_reset
    id: factory_reset_button
    name: "Factory Reset"
    entity_category: diagnostic
    internal: true
  - platform: template
    id: btn_play_song_1
    name: "Play Song 1"
    on_press:
      then:
        - script.execute: play_song_1
  - platform: template
    id: btn_play_song_2
    name: "Play Song 2"
    on_press:
      then:
        - script.execute: play_song_2
  - platform: template
    id: btn_play_song_3
    name: "Play Song 3"
    on_press:
      then:
        - script.execute: play_song_3
  - platform: template
    id: btn_play_song_4
    name: "Play Song 4"
    on_press:
      then:
        - script.execute: play_song_4
  - platform: template
    id: btn_play_song_5
    name: "Play Song 5"
    on_press:
      then:
        - script.execute: play_song_5

number:
  - platform: template
    name: "Sleep Duration"
    id: deep_sleep_sleep_duration
    min_value: 0
    max_value: 800
    step: 1
    mode: box
    update_interval: never
    optimistic: true
    restore_value: true
    initial_value: 24
    icon: "mdi:arrow-collapse-right"
    entity_category: CONFIG
    unit_of_measurement: "h"
    on_value:
      then:
        - lambda: |-
            // Fires at boot too, via TemplateNumber::setup(). Both guards are
            // load-bearing: set_sleep_duration(0) arms a 0us timer wake, i.e. an
            // unrecoverable boot loop, and timer_wake_enabled is false on H-3D.
            if (${timer_wake_enabled} && x > 0) {
              id(deep_sleep_1).set_sleep_duration((uint32_t) (x * 60 * 60 * 1000));
            }

  - platform: template
    name: Volume
    id: volume_control
    min_value: 0
    max_value: 100
    initial_value: 50
    unit_of_measurement: "%"
    step: 1
    optimistic: true
    restore_value: true
    on_value:
      - lambda: id(rtttl_buzzer).set_gain(pow(x / 100.0f, 3));

text_sensor:
  - platform: template
    id: wakeup_button_pressed
    name: "Wake-up Button Pressed"
    icon: "mdi:gesture-tap-button"

text:
  - platform: template
    name: "Song Text 1"
    id: song_1
    icon: mdi:music-note
    entity_category: "config"
    restore_value: true
    mode: text
    optimistic: true
    initial_value: "Snowman:d=8,o=5,b=200:2g,4e.,f,4g,2c6,b,c6,4d6,4c6,4b,a,2g.,b,c6,4d6,4c6,4b,a,a,g,4c6,4e.,g,a,4g,4f,4e,4d,2c.,4c,4a,4a,4c6,4c6,4b,4a,4g,4e,4f,4a,4g,4f,2e.,4e,4d,4d,4g,4g,4b,4b,4d6,d6,b,4d6,4c6,4b,4a,4g,4p,2g"
  - platform: template
    name: "Song Text 2"
    id: song_2
    icon: mdi:music-note
    entity_category: "config"
    restore_value: true
    mode: text
    optimistic: true
    initial_value: "rudolph:d=4,o=5,b=125:8g.,16a,8p,16g.,e,c6,a,2g.,8g.,16a,8g.,16a,g,c6,1b,8f.,16g,8p,16f.,d,b,a,2g.,8g.,16a,8g.,16a,g,a,1e,8g.,16a,8p,16g.,e,c6,a,1g,8g.,16a,8g.,16a,g,c6,1b,8f.,16g,8p,16f.,d,b,a,1g,8g.,16a,8g.,16a,g,d6,2c6;"
  - platform: template
    name: "Song Text 3"
    id: song_3
    icon: mdi:music-note
    entity_category: "config"
    restore_value: true
    mode: text
    optimistic: true
    initial_value: "jingle:d=8,o=5,b=120:e6,e6,e6.,16p,e6,e6,e6.,16p,e6,g6,c6.,16d6,e6.,p,f6,f6,f6.,16f6,f6,e6,e6,16e6,16e6,e6,d6,d6,e6,d6.,16p,g6,p,e6,e6,e6.,16p,e6,e6,e6.,16p,e6,g6,c6.,16d6,2e6,f6,f6,f6.,16f6,f6,e6,e6,16e6,16e6,g6,g6,f6,d6,2c6;"
  - platform: template
    name: "Song Text 4"
    id: song_4
    icon: mdi:music-note
    entity_category: "config"
    restore_value: true
    mode: text
    optimistic: true
    initial_value: "bluechristmas:d=4,o=5,b=90:8c,f,g,1a,16a,16g,16a,2g,f,e,2g.,c,g.,8a,2a#.,16a#,16c6,16a#,32c6,16a#,2a.,g,f,2a,8a,8a#,8a,2c6.,8a#,c6,8a#.,2a,2c6.,8a#,8a.,2g,g,1a,2a,g,8f,2a,g,f,e,e,f,f#,g."
  - platform: template
    name: "Song Text 5"
    id: song_5
    icon: mdi:music-note
    entity_category: "config"
    restore_value: true
    mode: text
    optimistic: true
    # Hook looped 3x: 24.0s, 247 of the 254 chars the NVS preference holds.
    initial_value: "Barbie Girl:o=5,d=8,b=125,b=125:g#,e,g#,c#6,4a,4p,f#,d#,f#,b,4g#,f#,e,4p,e,c#,4f#,4c#,4p,f#,e,4g#,4f#,4p,g#,e,g#,c#6,4a,4p,f#,d#,f#,b,4g#,f#,e,4p,e,c#,4f#,4c#,4p,f#,e,4g#,4f#,4p,g#,e,g#,c#6,4a,4p,f#,d#,f#,b,4g#,f#,e,4p,e,c#,4f#,4c#,4p,f#,e,4g#,4f#"

binary_sensor:
  - platform: gpio
    pin:
      number: GPIO9
      inverted: true
      mode:
        input: true
        pullup: true
      ignore_strapping_warning: true
    id: reset_button
    on_press:
      then:
        - lambda: |-
            id(button_press_timestamp) = millis();
        - script.execute: dismiss_first_boot
    on_release:
      then:
        - if:
            condition:
              lambda: 'return (millis() - id(button_press_timestamp)) >= 10000;'
            then:
              # Remove Wifi
              - switch.turn_on: factory_reset_switch
            else:
              - if:
                  condition:
                    lambda: 'return (millis() - id(button_press_timestamp)) >= 3000;'
                  then:
                    # Turn Prevent Sleep On. The explicit prevent call is for
                    # H-3D, whose prevent_sleep switch has no on_turn_on hook.
                    - switch.turn_on: prevent_sleep
                    - lambda: 'id(deep_sleep_1).prevent_deep_sleep();'
                  else:
                    # Only this branch is swallowed - factory reset must always
                    # work.
                    - if:
                        condition:
                          lambda: 'return !id(swallow_button_action);'
                        then:
                          # script.wait, not delay(): a lambda delay blocks
                          # Application::loop(), so the status colour never
                          # rendered and lightTest stomped it mid-script.
                          - script.execute: statusCheck
                          - script.wait: statusCheck
                          - script.execute: lightTest

  # H-3 Individual Song Buttons (3 buttons)
  - platform: gpio
    id: back_button_1
    pin:
      number: GPIO7
      mode:
        input: true
        pulldown: true
      allow_other_uses: true
    name: "Song Button 1"
    # Debounce - required by the multi-click patterns.
    filters:
      - delayed_on_off: 20ms
    on_press:
      then:
        - script.execute: dismiss_first_boot
    # Same rule as button 3: the inter-click gap (0.4s) MUST stay shorter than
    # the single-click wait (0.5s), or a second press in the overlap fires both.
    on_multi_click:
    # Double click -> song 4
    - timing:
        - ON for at most 1s
        - OFF for at most 0.4s
        - ON for at most 1s
        - OFF for at least 0.2s
      then:
        - if:
            condition:
              lambda: 'return !id(swallow_button_action);'
            then:
              - script.execute: play_song_4
    # Single click -> song 1
    - timing:
        - ON for at most 1s
        - OFF for at least 0.5s
      then:
        - if:
            condition:
              lambda: 'return !id(swallow_button_action);'
            then:
              - script.execute: play_song_1
    # Hold -> play_song_4. Same gesture the deep-sleep wake path uses, so it is
    # learned once and works asleep or awake. A single open-ended timing takes
    # a fast path in MultiClickTriggerBase that fires mid-hold; the two patterns
    # above cap ON at 1s and have already invalidated, so exactly one fires.
    # invalid_cooldown: 0s is load-bearing - the default 1s would block matching
    # after a short tap, making "tap, then hold" (the obvious retry) do nothing.
    - timing:
        - ON for at least ${hold_gesture_length}
      invalid_cooldown: 0s
      then:
        - if:
            condition:
              lambda: 'return !id(swallow_button_action);'
            then:
              - script.execute: play_song_4

  - platform: gpio
    id: back_button_2
    pin:
      number: GPIO5
      mode:
        input: true
        pulldown: true
      allow_other_uses: true
    name: "Song Button 2"
    filters:
      - delayed_on_off: 20ms
    on_press:
      then:
        - script.execute: dismiss_first_boot
    on_release:
      then:
        - if:
            condition:
              lambda: 'return !id(swallow_button_action);'
            then:
              - script.execute: play_song_2

  - platform: gpio
    id: back_button_3
    pin:
      number: GPIO4
      mode:
        input: true
        pulldown: true
      allow_other_uses: true
    name: "Song Button 3"
    filters:
      - delayed_on_off: 20ms
    on_press:
      then:
        - script.execute: dismiss_first_boot
    # Independent triggers on one pin: the inter-click gap (0.4s) MUST stay
    # shorter than the single-click wait (0.5s) or a press in the overlap
    # fires both.
    on_multi_click:
    # Double click -> song 5 (Barbie Girl)
    - timing:
        - ON for at most 1s
        - OFF for at most 0.4s
        - ON for at most 1s
        - OFF for at least 0.2s
      then:
        - if:
            condition:
              lambda: 'return !id(swallow_button_action);'
            then:
              - script.execute: play_song_5
    # Single click -> song 3
    - timing:
        - ON for at most 1s
        - OFF for at least 0.5s
      then:
        - if:
            condition:
              lambda: 'return !id(swallow_button_action);'
            then:
              - script.execute: play_song_3
    # Hold -> play_song_5. Same gesture the deep-sleep wake path uses, so it is
    # learned once and works asleep or awake. A single open-ended timing takes
    # a fast path in MultiClickTriggerBase that fires mid-hold; the two patterns
    # above cap ON at 1s and have already invalidated, so exactly one fires.
    # invalid_cooldown: 0s is load-bearing - the default 1s would block matching
    # after a short tap, making "tap, then hold" (the obvious retry) do nothing.
    - timing:
        - ON for at least ${hold_gesture_length}
      invalid_cooldown: 0s
      then:
        - if:
            condition:
              lambda: 'return !id(swallow_button_action);'
            then:
              - script.execute: play_song_5

sensor:
  - platform: internal_temperature
    name: "ESP Temperature"
    id: sys_esp_temperature

  - platform: uptime
    name: Uptime
    id: sys_uptime
    update_interval: 60s

light:
  # All 37 LEDs on ONE data line on GPIO3, wired:
  #   body(24) -> mouth(5) -> nose(1) -> eyes(2) -> hat(5)
  # Index map (partition from/to are INCLUSIVE):
  #   body 0-23   mouth 24-28   nose 29   eyes 30-31   hat 32-36
  # The chain is internal on purpose: turning the parent light on/off rewrites
  # the whole buffer and stomps whatever the partitions are doing.
  - platform: esp32_rmt_led_strip
    id: led_chain
    internal: true
    pin: GPIO3
    default_transition_length: 0s
    chipset: WS2812
    num_leds: 37
    rgb_order: grb
    rmt_symbols: 48
    # One data line = one correction for every segment (head parts were 30%).
    color_correct: [40%, 40%, 40%]
    effects: &led_effects
      - pulse:
          name: "Slow Pulse"
          transition_length: 250ms
          update_interval: 250ms
          min_brightness: 50%
          max_brightness: 100%
      - pulse:
          name: "Fast Pulse"
          transition_length: 100ms
          update_interval: 100ms
          min_brightness: 50%
          max_brightness: 100%
      - addressable_lambda:
          name: "RainbowWave"
          update_interval: 100ms  # Controls speed of wave movement
          lambda: |-
            static int start_hue = 0; // Initial hue position

            // Function to convert HSV to RGB
            auto hsv_to_rgb = [](float hue, float saturation, float value) -> Color {
              int h = (int)(hue / 60) % 6;
              float f = hue / 60 - h;
              float p = value * (1 - saturation);
              float q = value * (1 - f * saturation);
              float t = value * (1 - (1 - f) * saturation);

              float r = 0, g = 0, b = 0;
              if (h == 0) { r = value; g = t; b = p; }
              else if (h == 1) { r = q; g = value; b = p; }
              else if (h == 2) { r = p; g = value; b = t; }
              else if (h == 3) { r = p; g = q; b = value; }
              else if (h == 4) { r = t; g = p; b = value; }
              else if (h == 5) { r = value; g = p; b = q; }

              return Color(r * 255, g * 255, b * 255);
            };

            for (int i = 0; i < it.size(); i++) {
              // Calculate the hue for each LED, offset by position and starting hue
              float hue = fmod(start_hue + (i * 10), 360);  // Adjust "10" for wave tightness

              // Convert HSV to RGB and apply it to the LED
              it[i] = hsv_to_rgb(hue, 1.0, 1.0);  // Full saturation and brightness
            }

            // Increment start_hue to create the wave movement
            start_hue = (start_hue + 5) % 360;  // Adjust "5" for wave speed
      - addressable_lambda:
          name: "TwinklingWhite"
          update_interval: 100ms  # Update frequently for subtle brightness changes
          lambda: |-
            for (int i = 0; i < it.size(); i++) {
              // Generate a random brightness factor between 50% and 100%
              float brightness_factor = 0.5 + (rand() % 30) / 75.0;

              // Apply brightness to white color (255, 255, 255) for a twinkle effect
              int white_r = 255 * brightness_factor;
              int white_g = 255 * brightness_factor;
              int white_b = 255 * brightness_factor;

              // Set LED color with adjusted brightness
              it[i] = Color(white_r, white_g, white_b);
            }
      - addressable_lambda:
          name: "RedGreen"
          update_interval: 1000ms  # Switch colors every second
          lambda: |-
            // Keep track of the current color cycle using a flag
            static bool red_green_cycle = true;

            for (int i = 0; i < it.size(); i++) {
              // Alternate between red and green for each LED
              if (i % 2 == 0) {
                if (red_green_cycle) {
                  it[i] = Color(255, 0, 0);  // Red
                } else {
                  it[i] = Color(0, 255, 0);  // Green
                }
              } else {
                if (red_green_cycle) {
                  it[i] = Color(0, 255, 0);  // Green
                } else {
                  it[i] = Color(255, 0, 0);  // Red
                }
              }
            }

            // Switch the color cycle after each update (1 second)
            red_green_cycle = !red_green_cycle;
      - addressable_lambda:
          name: "BlueGold"
          update_interval: 1000ms  # Switch colors every second
          lambda: |-
            // Keep track of the current color cycle using a flag
            static bool blue_gold_cycle = true;

            for (int i = 0; i < it.size(); i++) {
              // Alternate between blue and gold for each LED
              if (i % 2 == 0) {
                if (blue_gold_cycle) {
                  it[i] = Color(0, 100, 255);  // Blue
                } else {
                  it[i] = Color(255, 215, 0);  // Gold
                }
              } else {
                if (blue_gold_cycle) {
                  it[i] = Color(255, 215, 0);  // Gold
                } else {
                  it[i] = Color(0, 100, 255);  // Blue
                }
              }
            }

            // Switch the color cycle after each update (1 second)
            blue_gold_cycle = !blue_gold_cycle;
      - addressable_lambda:
          name: "Sandstorm"
          update_interval: 20ms  # Very fast updates for rave effect
          lambda: |-
            const float PI = 3.14159265359;
            static int phase = 0;
            static int strobe_counter = 0;
            static int color_shift = 0;

            // Define rave colors - bright and vibrant
            static Color rave_colors[6] = {
              Color(255, 0, 0),    // Red
              Color(0, 0, 255),    // Blue
              Color(0, 255, 0),    // Green
              Color(255, 255, 0),  // Yellow
              Color(255, 0, 255),  // Magenta
              Color(0, 255, 255)   // Cyan
            };

            // BPM calculations - Sandstorm is ~138 BPM
            // 138 BPM = 2.3 beats per second = ~435ms per beat
            // Each update is 20ms, so ~22 updates per beat

            strobe_counter++;

            // Create strobing effect every few updates
            bool strobe_on = (strobe_counter % 3) != 0;  // Off 1/3 of the time for strobe

            // Rapid color changes
            if (strobe_counter % 5 == 0) {  // Change colors every 100ms
              color_shift = (color_shift + 1) % 6;
            }

            // Phase shift for wave effects
            phase = (phase + 15) % 360;  // Very fast phase movement

            for (int i = 0; i < it.size(); i++) {
              if (!strobe_on) {
                // Strobe off - black
                it[i] = Color(0, 0, 0);
              } else {
                // Calculate position-based effects
                float position_factor = (float)i / it.size();
                int wave_offset = (int)(position_factor * 180);

                // Pulsing intensity based on sine wave
                float intensity = 0.5 + 0.5 * sin((phase + wave_offset) * PI / 180);

                // Select color based on position and time
                int color_index = (color_shift + (i % 3)) % 6;
                Color base_color = rave_colors[color_index];

                // Random sparkle effect
                if (rand() % 100 < 10) {  // 10% chance of max brightness sparkle
                  intensity = 1.0;
                }

                // Apply intensity to color
                it[i] = Color(
                  base_color.r * intensity,
                  base_color.g * intensity,
                  base_color.b * intensity
                );
              }
            }

            // Reset strobe counter to stay in sync
            if (strobe_counter >= 22) {  // ~1 beat
              strobe_counter = 0;
            }
      - addressable_lambda:
          name: "TwinklingRed"
          update_interval: 100ms  # Update frequently for subtle brightness changes
          lambda: |-
            for (int i = 0; i < it.size(); i++) {
              // Generate a random brightness factor between 30% and 100%
              float brightness_factor = 0.3 + (rand() % 70) / 100.0;

              // Apply brightness to red color (255, 0, 0) for Rudolph's nose twinkle effect
              int red_value = 255 * brightness_factor;

              // Set LED color with adjusted brightness - pure red
              it[i] = Color(red_value, 0, 0);
            }
      - addressable_lambda:
          name: "TwinklingBlues"
          update_interval: 150ms  # Slower update for more mellow blue effect
          lambda: |-
            for (int i = 0; i < it.size(); i++) {
              // Generate random values for different shades of blue
              float brightness = 0.4 + (rand() % 60) / 100.0; // 40% to 100% brightness
              int shade_variation = rand() % 4; // 4 different blue shades

              int red_val = 0;
              int green_val = 0;
              int blue_val = 0;

              switch(shade_variation) {
                case 0: // Deep blue
                  red_val = 0 * brightness;
                  green_val = 50 * brightness;
                  blue_val = 255 * brightness;
                  break;
                case 1: // Sky blue
                  red_val = 135 * brightness;
                  green_val = 206 * brightness;
                  blue_val = 235 * brightness;
                  break;
                case 2: // Royal blue
                  red_val = 65 * brightness;
                  green_val = 105 * brightness;
                  blue_val = 225 * brightness;
                  break;
                case 3: // Ice blue
                  red_val = 176 * brightness;
                  green_val = 224 * brightness;
                  blue_val = 230 * brightness;
                  break;
              }

              it[i] = Color(red_val, green_val, blue_val);
            }
      - addressable_lambda:
          name: "PinkParty"
          update_interval: 30ms
          lambda: |-
            // Clock-driven, NOT positional. Every segment runs its own copy
            // (body 24, mouth 5, nose 1, eyes 2, hat 5), so a gradient over
            // i/it.size() would freeze the 1-LED nose on one flat colour.
            const float TAU = 6.28318530718f;
            const uint32_t now = millis();
            float breath_phase = (now % 920u) / 920.0f * TAU;
            float tint_phase = (now % 6400u) / 6400.0f * TAU;
            float breath_raw = 0.5f + 0.5f * sinf(breath_phase);
            float breath = 0.55f + 0.45f * (breath_raw * breath_raw);

            // Only 3+ LED segments get the travelling ripple - on the 2-LED
            // eyes a per-pixel offset reads as a fault, not a pattern.
            float tint_step = (it.size() >= 3) ? 0.35f : 0.0f;

            // color_correct 40% x brightness 80% = ~0.32, so keep values high
            // or the colour goes muddy on the wire.
            int red_value = (int)(255.0f * breath);

            for (int i = 0; i < it.size(); i++) {
              if (rand() % 100 < 4) {  // single-frame pink glitter
                it[i] = Color(255, 150, 210);
                continue;
              }
              // Walks magenta (255,0,255) <-> hot pink (255,105,180); green
              // stays under red and blue so it never washes out to white.
              float tint = 0.5f + 0.5f * sinf(tint_phase - i * tint_step);
              it[i] = Color(red_value,
                            (int)(105.0f * tint * breath),
                            (int)((255.0f - 75.0f * tint) * breath));
            }

  # Segment views into the chain. Effects run per segment - an
  # addressable_lambda sees only that segment's LEDs.

  # LEDs 0-23
  - platform: partition
    id: body_light
    name: "Body Light"
    default_transition_length: 0s
    segments:
      - { id: led_chain, from: 0, to: 23 }
    effects: *led_effects

  # LEDs 24-28
  - platform: partition
    id: mouth_light
    name: "Mouth Light"
    default_transition_length: 0s
    segments:
      - { id: led_chain, from: 24, to: 28 }
    effects: *led_effects

  # LED 29
  - platform: partition
    id: nose_light
    name: "Nose Light"
    default_transition_length: 0s
    segments:
      - { id: led_chain, from: 29, to: 29 }
    effects: *led_effects

  # LEDs 30-31
  - platform: partition
    id: eyes_light
    name: "Eyes Light"
    default_transition_length: 0s
    segments:
      - { id: led_chain, from: 30, to: 31 }
    effects: *led_effects

  # LEDs 32-36
  - platform: partition
    id: hat_light
    name: "Hat Light"
    default_transition_length: 0s
    segments:
      - { id: led_chain, from: 32, to: 36 }
    effects: *led_effects

script:
  - id: all_lights_off
    then:
      - light.turn_off: body_light
      - light.turn_off: mouth_light
      - light.turn_off: eyes_light
      - light.turn_off: nose_light
      - light.turn_off: hat_light

  # Acknowledges the first-boot indicator. Every button calls this on_press;
  # it is a no-op once runTest is clear.
  - id: dismiss_first_boot
    then:
      - if:
          condition:
            lambda: "return id(runTest);"
          then:
            - lambda: "id(runTest) = false;"
            - script.execute: all_lights_off
            - lambda: "id(swallow_button_action) = true;"
            - script.execute: swallow_clear
            - script.execute: sleep_grace_period

  # Hands back the block testScript took, but NOT immediately: run_duration has
  # already elapsed and latched next_enter_deep_sleep_, so releasing it here
  # would sleep the unit on the next loop. Give the press a normal wake window.
  - id: sleep_grace_period
    then:
      - delay: ${run_duration_gpio}
      - script.execute: resumeSleep

  # Eats the button action an acknowledging or waking press is about to
  # produce. 2s covers the worst case: a 1s ON ceiling plus the 0.5s
  # single-click wait, and the 1.2s hold. Time-bounded rather than consumed by
  # the handler - a flag the handler clears leaks whenever the expected pattern
  # never matches, and would then swallow the NEXT press.
  - id: swallow_clear
    then:
      - delay: 2s
      - lambda: "id(swallow_button_action) = false;"

  # Deep-sleep wake decoding. BOTH device files call this and do nothing else,
  # so their decoders cannot drift apart. Do not inline it back into either.
  #
  # Do NOT read the button level synchronously here: at on_boot -100 we are still
  # in Application::setup() with no scheduler ticks, so the 20ms filter has not
  # fired and state/has_state are false for every button. The wait_until below is
  # what yields to the loop and lets the real level arrive.
  #
  # The gesture is a HOLD, not a double-click, and that is forced: boot from the
  # ext1 wake outlasts a ~180-350ms double click, so both edges are gone before
  # the ISR attaches. ext1 gives a latched mask with no count. A hold is a level,
  # and a level survives the boot window.
  - id: wake_decoder
    then:
      - lambda: |-
          uint64_t wake = esp_sleep_get_ext1_wakeup_status();
          id(wake_button) = 0;

          if (wake != 0) {
            uint32_t low = (uint32_t)(wake & 0xFFFFFFFFULL);
            ESP_LOGI("Apollo", "Deep sleep wake detected, wake status: 0x%llx", wake);
            // ext1 mask bit N == GPIO N. Button 1 = GPIO7, 2 = GPIO5, 3 = GPIO4.
            if ((low) & (1<<(7))) {
              id(wake_button) = 1;
              id(wakeup_button_pressed).publish_state("1");
            }
            else if ((low) & (1<<(5))) {
              id(wake_button) = 2;
              id(wakeup_button_pressed).publish_state("2");
            }
            else if ((low) & (1<<(4))) {
              id(wake_button) = 3;
              id(wakeup_button_pressed).publish_state("3");
            }
            else {
              id(wakeup_button_pressed).publish_state("0");
            }
          }
          else {
            if (id(wakeup_button_pressed).state == "") {
              ESP_LOGI("Apollo", "No wake source detected, setting to 0");
              id(wakeup_button_pressed).publish_state("0");
            }
          }
      # Button 2 has no alternate song, so it keeps the old zero-latency path.
      - if:
          condition:
            lambda: 'return id(wake_button) == 2;'
          then:
            - button.press: btn_play_song_2
      - if:
          condition:
            lambda: 'return id(wake_button) == 1;'
          then:
            # ~20-40ms. Timeout is a dead-man switch: falls through to song 1.
            - wait_until:
                condition:
                  lambda: 'return id(back_button_1).has_state();'
                timeout: 250ms
            - if:
                condition:
                  binary_sensor.is_on: back_button_1
                then:
                  # Releasing inside the window ends this wait early.
                  - wait_until:
                      condition:
                        binary_sensor.is_off: back_button_1
                      timeout: ${wake_hold_confirm}
                  - if:
                      condition:
                        binary_sensor.is_on: back_button_1
                      then:
                        - button.press: btn_play_song_4
                      else:
                        - button.press: btn_play_song_1
                else:
                  - button.press: btn_play_song_1
      - if:
          condition:
            lambda: 'return id(wake_button) == 3;'
          then:
            - wait_until:
                condition:
                  lambda: 'return id(back_button_3).has_state();'
                timeout: 250ms
            - if:
                condition:
                  binary_sensor.is_on: back_button_3
                then:
                  - wait_until:
                      condition:
                        binary_sensor.is_off: back_button_3
                      timeout: ${wake_hold_confirm}
                  - if:
                      condition:
                        binary_sensor.is_on: back_button_3
                      then:
                        - button.press: btn_play_song_5
                      else:
                        - button.press: btn_play_song_3
                else:
                  - button.press: btn_play_song_3
      # The waking press is still live and its normal handler has not fired
      # yet, and no play_song_* script blocks, so mode: single gives no dedup -
      # the second execute just restarts the song. Armed here, AFTER the
      # gesture resolves, so the window runs from the release, not from boot.
      - if:
          condition:
            lambda: 'return id(wake_button) != 0;'
          then:
            - lambda: "id(swallow_button_action) = true;"
            - script.execute: swallow_clear

  - id: play_song_1
    then:
      - light.turn_on:
          brightness: 80%
          id: body_light
          effect: "RainbowWave"
      - light.turn_on:
          brightness: 80%
          id: mouth_light
          effect: "RainbowWave"
      - light.turn_on:
          brightness: 80%
          id: eyes_light
          effect: "RainbowWave"
      - light.turn_on:
          brightness: 80%
          id: nose_light
          effect: "RainbowWave"
      - light.turn_on:
          brightness: 80%
          id: hat_light
          effect: "RainbowWave"
      - rtttl.play:
          rtttl: !lambda 'return id(song_1).state;'
      - lambda: "id(song_active) = id(rtttl_buzzer).is_playing();"

  - id: play_song_2
    then:
      - light.turn_on:
          brightness: 80%
          id: body_light
          effect: "TwinklingWhite"
      - light.turn_on:
          brightness: 80%
          id: mouth_light
          effect: "TwinklingWhite"
      - light.turn_on:
          brightness: 80%
          id: eyes_light
          effect: "TwinklingWhite"
      - light.turn_on:
          brightness: 80%
          id: nose_light
          effect: "TwinklingRed"
      - light.turn_on:
          brightness: 80%
          id: hat_light
          effect: "TwinklingWhite"
      - rtttl.play:
          rtttl: !lambda 'return id(song_2).state;'
      - lambda: "id(song_active) = id(rtttl_buzzer).is_playing();"

  - id: play_song_3
    then:
      - light.turn_on:
          brightness: 80%
          id: body_light
          effect: "RedGreen"
      - light.turn_on:
          brightness: 80%
          id: mouth_light
          effect: "RedGreen"
      - light.turn_on:
          brightness: 80%
          id: eyes_light
          effect: "RedGreen"
      - light.turn_on:
          brightness: 80%
          id: nose_light
          effect: "RedGreen"
      - light.turn_on:
          brightness: 80%
          id: hat_light
          effect: "RedGreen"
      - rtttl.play:
          rtttl: !lambda 'return id(song_3).state;'
      - lambda: "id(song_active) = id(rtttl_buzzer).is_playing();"

  - id: play_song_4
    then:
      - light.turn_on:
          brightness: 80%
          id: body_light
          effect: "TwinklingBlues"
      - light.turn_on:
          brightness: 80%
          id: mouth_light
          effect: "TwinklingBlues"
      - light.turn_on:
          brightness: 80%
          id: eyes_light
          effect: "TwinklingBlues"
      - light.turn_on:
          brightness: 80%
          id: nose_light
          effect: "TwinklingBlues"
      - light.turn_on:
          brightness: 80%
          id: hat_light
          effect: "TwinklingBlues"
      - rtttl.play:
          rtttl: !lambda 'return id(song_4).state;'
      - lambda: "id(song_active) = id(rtttl_buzzer).is_playing();"

  - id: play_song_5
    then:
      - light.turn_on:
          brightness: 80%
          id: body_light
          effect: "PinkParty"
      - light.turn_on:
          brightness: 80%
          id: mouth_light
          effect: "PinkParty"
      - light.turn_on:
          brightness: 80%
          id: eyes_light
          effect: "PinkParty"
      - light.turn_on:
          brightness: 80%
          id: nose_light
          effect: "PinkParty"
      - light.turn_on:
          brightness: 80%
          id: hat_light
          effect: "PinkParty"
      - rtttl.play:
          rtttl: !lambda 'return id(song_5).state;'
      - lambda: "id(song_active) = id(rtttl_buzzer).is_playing();"

  - id: play_song_x
    then:
      - light.turn_on:
          brightness: 80%
          id: body_light
          effect: "Sandstorm"
      - light.turn_on:
          brightness: 80%
          id: mouth_light
          effect: "Sandstorm"
      - light.turn_on:
          brightness: 80%
          id: eyes_light
          effect: "Sandstorm"
      - light.turn_on:
          brightness: 80%
          id: nose_light
          effect: "Sandstorm"
      - light.turn_on:
          brightness: 80%
          id: hat_light
          effect: "Sandstorm"
      - rtttl.play:
          rtttl: Sandstorm:d=16,o=6,b=85:e,e,e,e,8e,e,e,a,a,a,a,g,g,g,d,e,e,e,e, 8e,e,a,e,e,e,e,8e,e,d,e,e,e,e,e,8e,e,e,a,a,a,a,g,g,g,d,e,e,e,e,8e,e, a,e,e,e,e,8e,e,d,e,e,e,e,e,8e,e,e,a,a,a,a,g,g,g,d,e,e,e,e,8e,e,a,e, e,e,e,8e,e,d,e
      - lambda: "id(song_active) = id(rtttl_buzzer).is_playing();"

  # First-boot indicator: every zone green at 30%, no timeout. Only
  # dismiss_first_boot clears it, so an un-acknowledged unit shows it again on
  # every boot.
  - id: testScript
    then:
      # H-3D would otherwise sleep out from under it after run_duration.
      - lambda: "id(deep_sleep_1).prevent_deep_sleep();"
      - light.turn_on:
          id: body_light
          brightness: 30%
          red: 0%
          green: 100%
          blue: 0%
      - light.turn_on:
          id: mouth_light
          brightness: 30%
          red: 0%
          green: 100%
          blue: 0%
      - light.turn_on:
          id: eyes_light
          brightness: 30%
          red: 0%
          green: 100%
          blue: 0%
      - light.turn_on:
          id: nose_light
          brightness: 30%
          red: 0%
          green: 100%
          blue: 0%
      - light.turn_on:
          id: hat_light
          brightness: 30%
          red: 0%
          green: 100%
          blue: 0%

  # Manual all-zone check from a short reset-button press. Timed, and never
  # touches runTest - it cannot re-arm the first-boot indicator.
  - id: lightTest
    then:
      - light.turn_on:
          id: body_light
          brightness: 80%
          red: 0%
          green: 100%
          blue: 0%
      - light.turn_on:
          id: mouth_light
          brightness: 80%
          red: 0%
          green: 100%
          blue: 0%
      - light.turn_on:
          id: eyes_light
          brightness: 80%
          red: 0%
          green: 100%
          blue: 0%
      - light.turn_on:
          id: nose_light
          brightness: 80%
          red: 0%
          green: 100%
          blue: 0%
      - light.turn_on:
          id: hat_light
          brightness: 80%
          red: 0%
          green: 100%
          blue: 0%
      - delay: 5s
      - script.execute: all_lights_off
