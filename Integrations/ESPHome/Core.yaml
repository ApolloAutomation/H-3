binary_sensor:
  - platform: gpio
    pin:
      number: GPIO9
      inverted: true
      mode:
        input: true
        pullup: true
      ignore_strapping_warning: true
    id: reset_button
    on_press:
      then:
        - lambda: |-
            id(button_press_timestamp) = millis();
        - script.execute: dismiss_first_boot
    on_release:
      then:
        - if:
            condition:
              lambda: 'return (millis() - id(button_press_timestamp)) >= 10000;'
            then:
              # Remove Wifi
              - switch.turn_on: factory_reset_switch
            else:
              - if:
                  condition:
                    lambda: 'return (millis() - id(button_press_timestamp)) >= 3000;'
                  then:
                    # Explicit prevent call is for H-3D
                    - switch.turn_on: prevent_sleep
                    - lambda: 'id(deep_sleep_1).prevent_deep_sleep();'
                  else:
                    # Only this branch swallowed; reset always works
                    - if:
                        condition:
                          lambda: 'return !id(swallow_button_action);'
                        then:
                          # script.wait, not delay(): delay blocks loop()
                          - script.execute: statusCheck
                          - script.wait: statusCheck
                          - script.execute: lightTest

  # H-3 Individual Song Buttons (3 buttons)
  - platform: gpio
    id: back_button_1
    pin:
      number: GPIO7
      mode:
        input: true
        pulldown: true
      allow_other_uses: true
    name: "Song Button 1"
    entity_category: "diagnostic"
    # Debounce required by multi-click patterns
    filters:
      - delayed_on_off: 20ms
    on_press:
      then:
        - script.execute: dismiss_first_boot
    # Inter-click gap must stay under single-click wait
    on_multi_click:
    # Double click -> song 4
    - timing:
        - ON for at most 1s
        - OFF for at most 0.4s
        - ON for at most 1s
        - OFF for at least 0.2s
      then:
        - if:
            condition:
              lambda: 'return !id(swallow_button_action);'
            then:
              - script.execute: play_song_4
    # Single click -> song 1
    - timing:
        - ON for at most 1s
        - OFF for at least 0.5s
      then:
        - if:
            condition:
              lambda: 'return !id(swallow_button_action);'
            then:
              - script.execute: play_song_1
    # Hold -> song 4; invalid_cooldown 0s is load-bearing
    - timing:
        - ON for at least ${hold_gesture_length}
      invalid_cooldown: 0s
      then:
        - if:
            condition:
              lambda: 'return !id(swallow_button_action);'
            then:
              - script.execute: play_song_4

  - platform: gpio
    id: back_button_2
    pin:
      number: GPIO5
      mode:
        input: true
        pulldown: true
      allow_other_uses: true
    name: "Song Button 2"
    entity_category: "diagnostic"
    filters:
      - delayed_on_off: 20ms
    on_press:
      then:
        - script.execute: dismiss_first_boot
    # Inter-click gap must stay under single-click wait
    on_multi_click:
    # Double click -> song 6
    - timing:
        - ON for at most 1s
        - OFF for at most 0.4s
        - ON for at most 1s
        - OFF for at least 0.2s
      then:
        - if:
            condition:
              lambda: 'return !id(swallow_button_action);'
            then:
              - script.execute: play_song_6
    # Single click -> song 2
    - timing:
        - ON for at most 1s
        - OFF for at least 0.5s
      then:
        - if:
            condition:
              lambda: 'return !id(swallow_button_action);'
            then:
              - script.execute: play_song_2
    # Hold -> song 6; invalid_cooldown 0s is load-bearing
    - timing:
        - ON for at least ${hold_gesture_length}
      invalid_cooldown: 0s
      then:
        - if:
            condition:
              lambda: 'return !id(swallow_button_action);'
            then:
              - script.execute: play_song_6

  - platform: gpio
    id: back_button_3
    pin:
      number: GPIO4
      mode:
        input: true
        pulldown: true
      allow_other_uses: true
    name: "Song Button 3"
    entity_category: "diagnostic"
    filters:
      - delayed_on_off: 20ms
    on_press:
      then:
        - script.execute: dismiss_first_boot
    # Inter-click gap must stay under single-click wait
    on_multi_click:
    # Double click -> song 5 (Barbie Girl)
    - timing:
        - ON for at most 1s
        - OFF for at most 0.4s
        - ON for at most 1s
        - OFF for at least 0.2s
      then:
        - if:
            condition:
              lambda: 'return !id(swallow_button_action);'
            then:
              - script.execute: play_song_5
    # Single click -> song 3
    - timing:
        - ON for at most 1s
        - OFF for at least 0.5s
      then:
        - if:
            condition:
              lambda: 'return !id(swallow_button_action);'
            then:
              - script.execute: play_song_3
    # Hold -> song 5; invalid_cooldown 0s is load-bearing
    - timing:
        - ON for at least ${hold_gesture_length}
      invalid_cooldown: 0s
      then:
        - if:
            condition:
              lambda: 'return !id(swallow_button_action);'
            then:
              - script.execute: play_song_5

sensor:
  - platform: internal_temperature
    name: "ESP Temperature"
    id: sys_esp_temperature

  - platform: uptime
    name: Uptime
    id: sys_uptime
    update_interval: 60s

light:
  # 37 LEDs on one GPIO3 line; chain stays internal
  - platform: esp32_rmt_led_strip
    id: led_chain
    internal: true
    pin: GPIO3
    default_transition_length: 0s
    chipset: WS2812
    num_leds: 37
    rgb_order: grb
    rmt_symbols: 48
    # One data line, one correction per segment
    color_correct: [40%, 40%, 40%]
    effects: &led_effects
      - pulse:
          name: "Slow Pulse"
          transition_length: 250ms
          update_interval: 250ms
          min_brightness: 50%
          max_brightness: 100%
      - pulse:
          name: "Fast Pulse"
          transition_length: 100ms
          update_interval: 100ms
          min_brightness: 50%
          max_brightness: 100%
      - addressable_lambda:
          name: "RainbowWave"
          update_interval: 100ms  # Controls speed of wave movement
          lambda: |-
            static int start_hue = 0; // Initial hue position

            // Function to convert HSV to RGB
            auto hsv_to_rgb = [](float hue, float saturation, float value) -> Color {
              int h = (int)(hue / 60) % 6;
              float f = hue / 60 - h;
              float p = value * (1 - saturation);
              float q = value * (1 - f * saturation);
              float t = value * (1 - (1 - f) * saturation);

              float r = 0, g = 0, b = 0;
              if (h == 0) { r = value; g = t; b = p; }
              else if (h == 1) { r = q; g = value; b = p; }
              else if (h == 2) { r = p; g = value; b = t; }
              else if (h == 3) { r = p; g = q; b = value; }
              else if (h == 4) { r = t; g = p; b = value; }
              else if (h == 5) { r = value; g = p; b = q; }

              return Color(r * 255, g * 255, b * 255);
            };

            for (int i = 0; i < it.size(); i++) {
              // Calculate the hue for each LED, offset by position and starting hue
              float hue = fmod(start_hue + (i * 10), 360);  // Adjust "10" for wave tightness

              // Convert HSV to RGB and apply it to the LED
              it[i] = hsv_to_rgb(hue, 1.0, 1.0);  // Full saturation and brightness
            }

            // Increment start_hue to create the wave movement
            start_hue = (start_hue + 5) % 360;  // Adjust "5" for wave speed
      - addressable_lambda:
          name: "TwinklingWhite"
          update_interval: 100ms  # Update frequently for subtle brightness changes
          lambda: |-
            for (int i = 0; i < it.size(); i++) {
              // Generate a random brightness factor between 50% and 100%
              float brightness_factor = 0.5 + (rand() % 30) / 75.0;

              // Apply brightness to white color (255, 255, 255) for a twinkle effect
              int white_r = 255 * brightness_factor;
              int white_g = 255 * brightness_factor;
              int white_b = 255 * brightness_factor;

              // Set LED color with adjusted brightness
              it[i] = Color(white_r, white_g, white_b);
            }
      - addressable_lambda:
          name: "RedGreen"
          update_interval: 1000ms  # Switch colors every second
          lambda: |-
            // Keep track of the current color cycle using a flag
            static bool red_green_cycle = true;

            for (int i = 0; i < it.size(); i++) {
              // Alternate between red and green for each LED
              if (i % 2 == 0) {
                if (red_green_cycle) {
                  it[i] = Color(255, 0, 0);  // Red
                } else {
                  it[i] = Color(0, 255, 0);  // Green
                }
              } else {
                if (red_green_cycle) {
                  it[i] = Color(0, 255, 0);  // Green
                } else {
                  it[i] = Color(255, 0, 0);  // Red
                }
              }
            }

            // Switch the color cycle after each update (1 second)
            red_green_cycle = !red_green_cycle;
      - addressable_lambda:
          name: "BlueGold"
          update_interval: 1000ms  # Switch colors every second
          lambda: |-
            // Keep track of the current color cycle using a flag
            static bool blue_gold_cycle = true;

            for (int i = 0; i < it.size(); i++) {
              // Alternate between blue and gold for each LED
              if (i % 2 == 0) {
                if (blue_gold_cycle) {
                  it[i] = Color(0, 100, 255);  // Blue
                } else {
                  it[i] = Color(255, 215, 0);  // Gold
                }
              } else {
                if (blue_gold_cycle) {
                  it[i] = Color(255, 215, 0);  // Gold
                } else {
                  it[i] = Color(0, 100, 255);  // Blue
                }
              }
            }

            // Switch the color cycle after each update (1 second)
            blue_gold_cycle = !blue_gold_cycle;
      - addressable_lambda:
          name: "Sandstorm"
          update_interval: 20ms  # Very fast updates for rave effect
          lambda: |-
            const float PI = 3.14159265359;
            static int phase = 0;
            static int strobe_counter = 0;
            static int color_shift = 0;

            // Define rave colors - bright and vibrant
            static Color rave_colors[6] = {
              Color(255, 0, 0),    // Red
              Color(0, 0, 255),    // Blue
              Color(0, 255, 0),    // Green
              Color(255, 255, 0),  // Yellow
              Color(255, 0, 255),  // Magenta
              Color(0, 255, 255)   // Cyan
            };

            // BPM calculations - Sandstorm is ~138 BPM
            // 138 BPM = 2.3 beats per second = ~435ms per beat
            // Each update is 20ms, so ~22 updates per beat

            strobe_counter++;

            // Create strobing effect every few updates
            bool strobe_on = (strobe_counter % 3) != 0;  // Off 1/3 of the time for strobe

            // Rapid color changes
            if (strobe_counter % 5 == 0) {  // Change colors every 100ms
              color_shift = (color_shift + 1) % 6;
            }

            // Phase shift for wave effects
            phase = (phase + 15) % 360;  // Very fast phase movement

            for (int i = 0; i < it.size(); i++) {
              if (!strobe_on) {
                // Strobe off - black
                it[i] = Color(0, 0, 0);
              } else {
                // Calculate position-based effects
                float position_factor = (float)i / it.size();
                int wave_offset = (int)(position_factor * 180);

                // Pulsing intensity based on sine wave
                float intensity = 0.5 + 0.5 * sin((phase + wave_offset) * PI / 180);

                // Select color based on position and time
                int color_index = (color_shift + (i % 3)) % 6;
                Color base_color = rave_colors[color_index];

                // Random sparkle effect
                if (rand() % 100 < 10) {  // 10% chance of max brightness sparkle
                  intensity = 1.0;
                }

                // Apply intensity to color
                it[i] = Color(
                  base_color.r * intensity,
                  base_color.g * intensity,
                  base_color.b * intensity
                );
              }
            }

            // Reset strobe counter to stay in sync
            if (strobe_counter >= 22) {  // ~1 beat
              strobe_counter = 0;
            }
      - addressable_lambda:
          name: "TwinklingRed"
          update_interval: 100ms  # Update frequently for subtle brightness changes
          lambda: |-
            for (int i = 0; i < it.size(); i++) {
              // Generate a random brightness factor between 30% and 100%
              float brightness_factor = 0.3 + (rand() % 70) / 100.0;

              // Apply brightness to red color (255, 0, 0) for Rudolph's nose twinkle effect
              int red_value = 255 * brightness_factor;

              // Set LED color with adjusted brightness - pure red
              it[i] = Color(red_value, 0, 0);
            }
      - addressable_lambda:
          name: "TwinklingBlues"
          update_interval: 150ms  # Slower update for more mellow blue effect
          lambda: |-
            for (int i = 0; i < it.size(); i++) {
              // Generate random values for different shades of blue
              float brightness = 0.4 + (rand() % 60) / 100.0; // 40% to 100% brightness
              int shade_variation = rand() % 4; // 4 different blue shades

              int red_val = 0;
              int green_val = 0;
              int blue_val = 0;

              switch(shade_variation) {
                case 0: // Deep blue
                  red_val = 0 * brightness;
                  green_val = 50 * brightness;
                  blue_val = 255 * brightness;
                  break;
                case 1: // Sky blue
                  red_val = 135 * brightness;
                  green_val = 206 * brightness;
                  blue_val = 235 * brightness;
                  break;
                case 2: // Royal blue
                  red_val = 65 * brightness;
                  green_val = 105 * brightness;
                  blue_val = 225 * brightness;
                  break;
                case 3: // Ice blue
                  red_val = 176 * brightness;
                  green_val = 224 * brightness;
                  blue_val = 230 * brightness;
                  break;
              }

              it[i] = Color(red_val, green_val, blue_val);
            }
      - addressable_lambda:
          name: "PinkParty"
          update_interval: 30ms
          lambda: |-
            // Clock-driven, NOT positional. Every segment runs its own copy
            // (body 24, mouth 5, nose 1, eyes 2, hat 5), so a gradient over
            // i/it.size() would freeze the 1-LED nose on one flat colour.
            const float TAU = 6.28318530718f;
            const uint32_t now = millis();
            float breath_phase = (now % 920u) / 920.0f * TAU;
            float tint_phase = (now % 6400u) / 6400.0f * TAU;
            float breath_raw = 0.5f + 0.5f * sinf(breath_phase);
            float breath = 0.55f + 0.45f * (breath_raw * breath_raw);

            // Only 3+ LED segments get the travelling ripple - on the 2-LED
            // eyes a per-pixel offset reads as a fault, not a pattern.
            float tint_step = (it.size() >= 3) ? 0.35f : 0.0f;

            // color_correct 40% x brightness 80% = ~0.32, so keep values high
            // or the colour goes muddy on the wire.
            int red_value = (int)(255.0f * breath);

            for (int i = 0; i < it.size(); i++) {
              if (rand() % 100 < 4) {  // single-frame pink glitter
                it[i] = Color(255, 150, 210);
                continue;
              }
              // Walks magenta (255,0,255) <-> hot pink (255,105,180); green
              // stays under red and blue so it never washes out to white.
              float tint = 0.5f + 0.5f * sinf(tint_phase - i * tint_step);
              it[i] = Color(red_value,
                            (int)(105.0f * tint * breath),
                            (int)((255.0f - 75.0f * tint) * breath));
            }
      - addressable_lambda:
          name: "Snowfall"
          update_interval: 60ms
          lambda: |-
            // Clock-driven like PinkParty, for the same reason: the nose is a
            // single LED and the eyes are two, so anything keyed off
            // i/it.size() freezes those segments on one flat colour.
            const uint32_t now = millis();
            // Pale ice blue that drifts brighter and dimmer over ~4s.
            float drift = 0.5f + 0.5f * sinf((now % 4000u) / 4000.0f * 6.28318530718f);
            // color_correct 40% x brightness 80% = ~0.32, so keep the base high
            // or the blue reads as dark grey on the wire.
            int base_r = (int)(70.0f + 40.0f * drift);
            int base_g = (int)(120.0f + 50.0f * drift);

            for (int i = 0; i < it.size(); i++) {
              if (rand() % 100 < 7) {  // a flake catches the light
                it[i] = Color(255, 255, 255);
              } else {
                it[i] = Color(base_r, base_g, 255);
              }
            }

  # Segment views; effects run per segment

  # All 37 LEDs
  - platform: partition
    id: all_lights
    name: "All Lights"
    default_transition_length: 0s
    segments:
      - { id: led_chain, from: 0, to: 36 }
    effects: *led_effects

  # LEDs 0-23
  - platform: partition
    id: body_light
    name: "Body Light"
    default_transition_length: 0s
    segments:
      - { id: led_chain, from: 0, to: 23 }
    effects: *led_effects

  # LEDs 24-28
  - platform: partition
    id: mouth_light
    name: "Mouth Light"
    default_transition_length: 0s
    segments:
      - { id: led_chain, from: 24, to: 28 }
    effects: *led_effects

  # LED 29
  - platform: partition
    id: nose_light
    name: "Nose Light"
    default_transition_length: 0s
    segments:
      - { id: led_chain, from: 29, to: 29 }
    effects: *led_effects

  # LEDs 30-31
  - platform: partition
    id: eyes_light
    name: "Eyes Light"
    default_transition_length: 0s
    segments:
      - { id: led_chain, from: 30, to: 31 }
    effects: *led_effects

  # LEDs 32-36
  - platform: partition
    id: hat_light
    name: "Hat Light"
    default_transition_length: 0s
    segments:
      - { id: led_chain, from: 32, to: 36 }
    effects: *led_effects

script:
  - id: all_lights_off
    then:
      - light.turn_off: all_lights
      - light.turn_off: body_light
      - light.turn_off: mouth_light
      - light.turn_off: eyes_light
      - light.turn_off: nose_light
      - light.turn_off: hat_light

  # Acknowledges first-boot indicator; no-op once clear
  - id: dismiss_first_boot
    then:
      - if:
          condition:
            lambda: "return id(runTest);"
          then:
            - lambda: "id(runTest) = false;"
            - script.execute: all_lights_off
            - lambda: "id(swallow_button_action) = true;"
            - script.execute: swallow_clear
            - script.execute: sleep_grace_period

  # Delays sleep release so the press gets a window
  - id: sleep_grace_period
    # restart: a second execute must extend the window
    mode: restart
    then:
      - delay: ${run_duration_gpio}
      - script.execute: resumeSleep

  # Eats the acknowledging press; 2s worst case
  - id: swallow_clear
    # restart: two callers can arm on one press
    mode: restart
    then:
      - delay: 2s
      - lambda: "id(swallow_button_action) = false;"

  # Shared wake decoding; hold gesture, not double-click
  - id: wake_decoder
    then:
      - lambda: |-
          uint64_t wake = esp_sleep_get_ext1_wakeup_status();
          id(wake_button) = 0;

          if (wake != 0) {
            uint32_t low = (uint32_t)(wake & 0xFFFFFFFFULL);
            ESP_LOGI("Apollo", "Deep sleep wake detected, wake status: 0x%llx", wake);
            // ext1 mask bit N == GPIO N. Button 1 = GPIO7, 2 = GPIO5, 3 = GPIO4.
            if ((low) & (1<<(7))) {
              id(wake_button) = 1;
              id(wakeup_button_pressed).publish_state("1");
            }
            else if ((low) & (1<<(5))) {
              id(wake_button) = 2;
              id(wakeup_button_pressed).publish_state("2");
            }
            else if ((low) & (1<<(4))) {
              id(wake_button) = 3;
              id(wakeup_button_pressed).publish_state("3");
            }
            else {
              id(wakeup_button_pressed).publish_state("0");
            }
          }
          else {
            if (id(wakeup_button_pressed).state == "") {
              ESP_LOGI("Apollo", "No wake source detected, setting to 0");
              id(wakeup_button_pressed).publish_state("0");
            }
          }
      - if:
          condition:
            lambda: 'return id(wake_button) == 2;'
          then:
            - wait_until:
                condition:
                  lambda: 'return id(back_button_2).has_state();'
                timeout: 250ms
            - if:
                condition:
                  binary_sensor.is_on: back_button_2
                then:
                  - wait_until:
                      condition:
                        binary_sensor.is_off: back_button_2
                      timeout: ${wake_hold_confirm}
                  - if:
                      condition:
                        binary_sensor.is_on: back_button_2
                      then:
                        - button.press: btn_play_song_6
                      else:
                        - button.press: btn_play_song_2
                else:
                  - button.press: btn_play_song_2
      - if:
          condition:
            lambda: 'return id(wake_button) == 1;'
          then:
            # Timeout is a dead-man switch to song 1
            - wait_until:
                condition:
                  lambda: 'return id(back_button_1).has_state();'
                timeout: 250ms
            - if:
                condition:
                  binary_sensor.is_on: back_button_1
                then:
                  # Releasing early ends this wait
                  - wait_until:
                      condition:
                        binary_sensor.is_off: back_button_1
                      timeout: ${wake_hold_confirm}
                  - if:
                      condition:
                        binary_sensor.is_on: back_button_1
                      then:
                        - button.press: btn_play_song_4
                      else:
                        - button.press: btn_play_song_1
                else:
                  - button.press: btn_play_song_1
      - if:
          condition:
            lambda: 'return id(wake_button) == 3;'
          then:
            - wait_until:
                condition:
                  lambda: 'return id(back_button_3).has_state();'
                timeout: 250ms
            - if:
                condition:
                  binary_sensor.is_on: back_button_3
                then:
                  - wait_until:
                      condition:
                        binary_sensor.is_off: back_button_3
                      timeout: ${wake_hold_confirm}
                  - if:
                      condition:
                        binary_sensor.is_on: back_button_3
                      then:
                        - button.press: btn_play_song_5
                      else:
                        - button.press: btn_play_song_3
                else:
                  - button.press: btn_play_song_3
      # Armed after the gesture resolves, not at boot
      - if:
          condition:
            lambda: 'return id(wake_button) != 0;'
          then:
            - lambda: "id(swallow_button_action) = true;"
            - script.execute: swallow_clear

  - id: play_song_1
    then:
      # Must stop first because Rtttl::play() returns early while a song is running
      - rtttl.stop:
      # Zone effects below would fight an All Lights effect writing the same buffer
      - light.turn_off: all_lights
      - light.turn_on:
          brightness: 80%
          id: body_light
          effect: "RainbowWave"
      - light.turn_on:
          brightness: 80%
          id: mouth_light
          effect: "RainbowWave"
      - light.turn_on:
          brightness: 80%
          id: eyes_light
          effect: "RainbowWave"
      - light.turn_on:
          brightness: 80%
          id: nose_light
          effect: "RainbowWave"
      - light.turn_on:
          brightness: 80%
          id: hat_light
          effect: "RainbowWave"
      - rtttl.play:
          rtttl: !lambda 'return id(song_1).state;'
      - lambda: "id(song_active) = id(rtttl_buzzer).is_playing();"
      # Malformed string never fires on_finished_playback
      - if:
          condition:
            lambda: 'return !id(song_active);'
          then:
            - logger.log: "Song did not start - check the RTTTL string"
            - script.execute: all_lights_off

