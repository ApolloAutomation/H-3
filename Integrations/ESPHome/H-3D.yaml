esphome:
  name: "apollo-h-3d"
  friendly_name: Apollo H-3D
  comment: Apollo H-3D
  name_add_mac_suffix: true
  platformio_options:
    board_build.flash_mode: dio

  project:
    name: "ApolloAutomation.H-3D"
    version: "${version}"

  # Must match H-3.yaml.
  min_version: 2025.11.0
  on_boot:
    # Prevent Sleep is ALWAYS_OFF; no timer wake

    # Decoding lives in Core.yaml's wake_decoder
    - priority: -100
      then:
        - script.execute: wake_decoder

    - priority: -10
      then:
        - if:
            condition:
              - lambda: "return id(runTest);"
            then:
              - script.execute: testScript
  on_shutdown:
    - light.turn_off: body_light
    - light.turn_off: mouth_light
    - light.turn_off: eyes_light
    - light.turn_off: nose_light
    - light.turn_off: hat_light

# 15s bounds cold power-on; button wakes keep 90s
substitutions:
  run_duration_default: "15s"
  timer_wake_enabled: "false"

# Skips boot image validation; USB recovery only
esp32:
  framework:
    sdkconfig_options:
      CONFIG_BOOTLOADER_SKIP_VALIDATE_IN_DEEP_SLEEP: y

# Disabled: cannot recover without wifi/OTA
safe_mode:
  disabled: true

# Removes the ONLY debug channel on H-3D
logger:
  baud_rate: 0

switch:
  - platform: template
    name: "Prevent Sleep"
    id: prevent_sleep
    icon: mdi:sleep
    restore_mode: ALWAYS_OFF
    optimistic: true
    entity_category: "config"

script:
  - id: statusCheck
    then:
      - light.turn_on:
          id: body_light
          brightness: 40%
          red: 0%
          green: 100%
          blue: 0%
      - delay: 5s
      - light.turn_off: body_light
  - id: ShouldSleep
    then:
      - if:
          condition:
            or:
              - switch.is_on: prevent_sleep
          then:
            - lambda: |-
                ESP_LOGW("Apollo", "Preventing Deep Sleep Due To OTA On Boot");
                id(deep_sleep_1).prevent_deep_sleep();
          else:
            - deep_sleep.enter:
                id: deep_sleep_1
  # No ota_mode; H-3D has no api/wifi
  - id: resumeSleep
    then:
      - if:
          condition:
            switch.is_off: prevent_sleep
          then:
            - lambda: |-
                id(deep_sleep_1).allow_deep_sleep();

packages:
  core: !include Core.yaml
