substitutions:
  # Manifest URL bases. Stable = GitHub Pages (main branch builds).
  # Beta = rolling "beta-fw" pre-release assets (beta branch builds).
  stable_manifest_base: "https://apolloautomation.github.io/H-3"
  beta_manifest_base: "https://github.com/ApolloAutomation/H-3/releases/download/beta-fw"
  ota_stable_manifest: "${stable_manifest_base}/firmware/manifest.json"
  ota_beta_manifest: "${beta_manifest_base}/manifest-standard.json"

esphome:
  name: "apollo-h-3"
  friendly_name: Apollo H-3
  comment: Apollo H-3
  name_add_mac_suffix: true
  platformio_options:
    board_build.flash_mode: dio

  project:
    name: "ApolloAutomation.H-3"
    version: "${version}"

  # Hard floor is 2024.6.0 (list-form ota:, http_request update, standalone
  # safe_mode:); tracks the rest of the fleet rather than the true minimum.
  min_version: 2025.11.0
  on_boot:
    # Point the update entity at the selected channel manifest.
    - priority: -100
      then:
        - script.execute: apply_ota_source
    # H-3 is opt-in for deep sleep
    - priority: 800
      then:
        - lambda: |-
            id(deep_sleep_1).prevent_deep_sleep();

    # No set_sleep_duration here: Core.yaml's deep_sleep_sleep_duration
    # on_value already converts at boot, and its ${timer_wake_enabled} guard
    # is the one that matters.
    - priority: -100
      then:
        - if:
            condition:
              or:
                - binary_sensor.is_on: ota_mode
                - switch.is_on: prevent_sleep
            then:
              - lambda: |-
                  ESP_LOGW("Apollo", "Deep sleep stays disabled (Prevent Sleep on or OTA mode)");
                  id(deep_sleep_1).prevent_deep_sleep();
            else:
              - lambda: |-
                  ESP_LOGI("Apollo", "Deep sleep opted in - enabling automatic sleep");
                  id(deep_sleep_1).allow_deep_sleep();
    # Decoding lives in Core.yaml's wake_decoder; this block must stay
    - priority: -100
      then:
        - script.execute: wake_decoder
    - priority: -10
      then:
        - if:
            condition:
              - lambda: "return id(runTest);"
            then:
              - script.execute: testScript
    # Re-apply the Bluetooth Proxy switch after all components set up, so BLE
    # scanning matches the switch state restored from flash.
    - priority: -300
      then:
        - if:
            condition:
              switch.is_on: bluetooth_proxy_switch
            then:
              - esp32_ble_tracker.start_scan:
                  continuous: true
            else:
              - esp32_ble_tracker.stop_scan:
  on_shutdown:
    - light.turn_off: body_light
    - light.turn_off: mouth_light
    - light.turn_off: eyes_light
    - light.turn_off: nose_light
    - light.turn_off: hat_light

dashboard_import:
  package_import_url: github://ApolloAutomation/H-3/Integrations/ESPHome/H-3.yaml
  import_full_config: false

deep_sleep:
  sleep_duration: 24h

ota:
  - platform: esphome
    id: ota_esphome
  - platform: http_request
    id: ota_managed

esp32_ble_tracker:
  id: ble_tracker
  # continuous is FALSE on purpose. The Bluetooth Proxy switch owns scanning,
  # and the on_boot priority -300 handler restores it. With continuous: true
  # the tracker starts a scan inside its own setup(), i.e. before that handler
  # runs, so a fresh unit scanned for a moment even with the switch off - which
  # is also the window esp32_improv needs to advertise on.
  scan_parameters:
    continuous: false

bluetooth_proxy:
  id: ble_proxy

# Improv over BLE. Required for the Made for ESPHome badge on any Wi-Fi
# project; improv_serial alone does not satisfy it. The component only
# advertises while the device has no Wi-Fi credentials (or has been off the
# network for wifi_timeout), and stops itself once wifi connects, so it costs
# nothing on a provisioned unit. Measured cost of adding it: +432 B RAM and
# +21 KB flash, because esp32_ble was already linked in for the proxy.
esp32_improv:
  id: ble_improv
  # 'none' = no physical authorization step, matching ESPHome's own reference
  # ESP32-C6 factory config. Swap in a binary_sensor id here if the ornament
  # should require a button press before it will accept credentials.
  authorizer: none
  status_indicator: improv_status_led

http_request:
  id: http_request_client
  verify_ssl: true
  # GitHub release-asset downloads answer with a redirect carrying a
  # ~3.6 KB Content-Security-Policy header; each header line must fit
  # this buffer or the request fails with "HTTP_CLIENT: Out of buffer".
  buffer_size_rx: 5120
  # The redirect target is a signed URL with a ~850-char query string; the
  # follow-up request line must fit the TX buffer or esp_http_client_open
  # fails with "Out of buffer" before sending anything.
  buffer_size_tx: 2048

safe_mode:
  id: safe_mode_component

update:
  - platform: http_request
    id: update_http_request
    name: Firmware Update
    # Defaults to the empty device class, which renders as a generic update in
    # Home Assistant. This one really is firmware.
    device_class: firmware
    source: ${ota_stable_manifest}

wifi:
  power_save_mode: HIGH
  output_power: 10
  ap:
    ssid: "Apollo H3 Hotspot"

logger:
  id: logger_component

improv_serial:
  id: serial_improv

captive_portal:
  id: captive_portal_component

web_server:
  id: web_server_component
  port: 80
  version: 3

# Drives the hat zone for esp32_improv. status_indicator must be a
# BinaryOutput, not a light, and it is the ONLY thing that sets
# improv::CAPABILITY_IDENTIFY - without it the provisioning app cannot ask the
# ornament to identify itself. Improv toggles this at most ~10 Hz and only on a
# real change, so it never floods the LED chain.
output:
  - platform: template
    type: binary
    id: improv_status_led
    write_action:
      - if:
          condition:
            lambda: "return state;"
          then:
            - light.turn_on:
                id: hat_light
                brightness: 60%
                red: 0%
                green: 40%
                blue: 100%
          else:
            - light.turn_off: hat_light

api:
  id: api_server
  # No key on purpose. A bare 'encryption:' compiles in Noise support without
  # baking a secret into a public config (Made for ESPHome forbids secrets and
  # passwords in the published YAML), and ESPHome keeps the plaintext helper
  # alongside it precisely so an adopting dashboard can hand the device a key
  # over plaintext on first adoption.
  encryption:
  # 'actions' is the current spelling; ESPHome still rename_key's the old
  # 'services' onto it, and the exposed Home Assistant service names are
  # unchanged either way.
  actions:
    - action: play_buzzer
      variables:
        song_str: string
      then:
        - rtttl.play:
            rtttl: !lambda 'return song_str;'
    - action: play_song_1
      then:
        - script.execute: play_song_1
    - action: play_song_2
      then:
        - script.execute: play_song_2
    - action: play_song_3
      then:
        - script.execute: play_song_3
    - action: play_song_4
      then:
        - script.execute: play_song_4
    - action: play_song_5
      then:
        - script.execute: play_song_5
    - action: play_song_6
      then:
        - script.execute: play_song_6
  reboot_timeout: 0s
  on_client_connected:
    then:
      - delay: 5s
      - if:
          condition:
            or:
              - binary_sensor.is_on: ota_mode
              - switch.is_on: prevent_sleep
          then:
            - lambda: |-
                ESP_LOGW("Apollo", "Preventing Deep Sleep Due To OTA Or Switch");
                id(deep_sleep_1).prevent_deep_sleep();
select:
  - platform: template
    name: "Firmware Channel"
    id: firmware_channel
    icon: mdi:source-branch
    entity_category: "config"
    optimistic: true
    restore_value: true
    options:
      - "Stable"
      - "Beta"
    initial_option: "Stable"
    on_value:
      then:
        - script.execute: apply_ota_source

button:
  # Renamed from "Firmware Update": the update: entity above already carries
  # that name, so Home Assistant showed the device two different entities with
  # one label. This one force-installs the selected channel even when the
  # update entity reports nothing available.
  - platform: template
    name: "Reinstall Firmware"
    id: update_firmware
    icon: mdi:cloud-download
    entity_category: "config"
    on_press:
      - logger.log: "Applying firmware update for the selected channel"
      - delay: 3s
      - script.execute: apply_ota_source
      - script.wait: apply_ota_source
      # The manifest fetch runs in its own task; give it a fixed window to land
      # (update.is_available stays false for same-version switches).
      - delay: 5s
      - lambda: id(update_http_request).perform(true);

  # Recovery entities. Both are diagnostic and both are things a support agent
  # will ask for before suggesting a reflash.
  - platform: restart
    name: "Restart"
    id: restart_button
    entity_category: "diagnostic"

  - platform: safe_mode
    name: "Restart (Safe Mode)"
    id: safe_mode_button
    entity_category: "diagnostic"

switch:
  - platform: template
    name: "Bluetooth Proxy"
    id: bluetooth_proxy_switch
    icon: mdi:bluetooth
    entity_category: "config"
    restore_mode: RESTORE_DEFAULT_OFF
    optimistic: true
    on_turn_on:
      - esp32_ble_tracker.start_scan:
          continuous: true
    on_turn_off:
      - esp32_ble_tracker.stop_scan:

  - platform: template
    name: "Prevent Sleep"
    id: prevent_sleep
    icon: mdi:sleep
    restore_mode: RESTORE_DEFAULT_ON
    optimistic: true
    entity_category: "config"
    on_turn_on:
      then:
        - lambda: |-
            id(deep_sleep_1).prevent_deep_sleep();
    on_turn_off:
      then:
        - if:
            condition:
              binary_sensor.is_off: ota_mode
            then:
              - lambda: |-
                  id(deep_sleep_1).allow_deep_sleep();

binary_sensor:
  - platform: status
    name: Online
    id: ink_ha_connected
  - platform: homeassistant
    name: "OTA Mode"
    id: ota_mode
    # Mirrors a Home Assistant helper back into HA, so it is never dashboard
    # material. Kept as an entity rather than internal: true so existing
    # automations that reference it do not break.
    entity_category: "diagnostic"
    entity_id: input_boolean.apollo_ota_mode
    on_press:
      then:
        - lambda: |-
            id(deep_sleep_1).prevent_deep_sleep();
    on_release:
      then:
        - if:
            condition:
              switch.is_off: prevent_sleep
            then:
              - lambda: |-
                  id(deep_sleep_1).allow_deep_sleep();

sensor:
  - platform: wifi_signal
    name: RSSI
    id: wifi_signal_db
    update_interval: 60s
    entity_category: "diagnostic"

# Support diagnostics. All disabled by default so they cost nothing on a
# normal install, but are one toggle away when someone reports a problem.
text_sensor:
  - platform: wifi_info
    ip_address:
      name: "IP Address"
      id: wifi_ip_address
      entity_category: "diagnostic"
      disabled_by_default: true
    ssid:
      name: "Connected SSID"
      id: wifi_ssid
      entity_category: "diagnostic"
      disabled_by_default: true
    bssid:
      name: "Connected BSSID"
      id: wifi_bssid
      entity_category: "diagnostic"
      disabled_by_default: true
    mac_address:
      name: "MAC Address"
      id: wifi_mac_address
      entity_category: "diagnostic"
      disabled_by_default: true

  - platform: version
    name: "ESPHome Version"
    id: esphome_version
    entity_category: "diagnostic"
    disabled_by_default: true

script:
  - id: apply_ota_source
    # Sets the OTA manifest URL from the Firmware Channel select (Stable/Beta).
    then:
      - lambda: |-
          const bool beta = id(firmware_channel).current_option() == "Beta";
          std::string url = beta ? "${ota_beta_manifest}" : "${ota_stable_manifest}";
          ESP_LOGI("firmware", "OTA manifest set to: %s", url.c_str());
          id(update_http_request).set_source_url(url);
      - component.update: update_http_request

  - id: statusCheck
    then:
      - if:
          condition:
            - lambda: 'return id(ink_ha_connected).state;'
          then:
            - logger.log: "Apollo Automation: Connected To HA"
            - light.turn_on:
                id: body_light
                brightness: 40%
                red: 0%
                green: 0%
                blue: 100%
          else:
            - if:
                condition:
                  - wifi.connected
                then:
                  - logger.log: "Apollo Automation: Connected To Wifi"
                  - light.turn_on:
                      id: body_light
                      brightness: 40%
                      red: 0%
                      green: 100%
                      blue: 0%
                else:
                  - logger.log: "Apollo Automation: Not Connected To Wifi"
                  - light.turn_on:
                      id: body_light
                      brightness: 40%
                      red: 100%
                      green: 100%
                      blue: 0%
      - delay: 5s
      - light.turn_off: body_light
  - id: ShouldSleep
    then:
      - if:
          condition:
            or:
              - binary_sensor.is_on: ota_mode
              - switch.is_on: prevent_sleep
          then:
            - lambda: |-
                ESP_LOGW("Apollo", "Preventing Deep Sleep Due To OTA On Boot");
                id(deep_sleep_1).prevent_deep_sleep();
          else:
            - deep_sleep.enter:
                id: deep_sleep_1
  # Same guards as prevent_sleep's on_turn_off. Normally a no-op on H-3.
  - id: resumeSleep
    then:
      - if:
          condition:
            and:
              - binary_sensor.is_off: ota_mode
              - switch.is_off: prevent_sleep
          then:
            - lambda: |-
                id(deep_sleep_1).allow_deep_sleep();


packages:
  core: !include Core.yaml
