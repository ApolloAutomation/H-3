substitutions:
  # Manifest bases: stable=Pages, beta=release assets
  stable_manifest_base: "https://apolloautomation.github.io/H-3"
  beta_manifest_base: "https://github.com/ApolloAutomation/H-3/releases/download/beta-fw"
  ota_stable_manifest: "${stable_manifest_base}/firmware/manifest.json"
  ota_beta_manifest: "${beta_manifest_base}/manifest-standard.json"
  # Quiet gap that ends a run of short BOOT presses
  boot_click_gap: "700ms"

esphome:
  name: "apollo-h-3"
  friendly_name: Apollo H-3
  comment: Apollo H-3
  name_add_mac_suffix: true
  platformio_options:
    board_build.flash_mode: dio

  project:
    name: "ApolloAutomation.H-3"
    version: "${version}"

  # improv_ble (renamed from esp32_improv) needs 2026.10
  min_version: 2026.10.0
  on_boot:
    - priority: 500
      then:
        - text_sensor.template.publish:
            id: apollo_firmware_version
            state: "${version}"
    # Point update entity at selected manifest
    - priority: -100
      then:
        - script.execute: apply_ota_source
    # H-3 is opt-in for deep sleep
    - priority: 800
      then:
        - lambda: |-
            id(deep_sleep_1).prevent_deep_sleep();

    # Core.yaml's on_value already converts at boot
    - priority: -100
      then:
        - if:
            condition:
              or:
                - binary_sensor.is_on: ota_mode
                - switch.is_on: prevent_sleep
            then:
              - lambda: |-
                  ESP_LOGW("Apollo", "Deep sleep stays disabled (Prevent Sleep on or OTA mode)");
                  id(deep_sleep_1).prevent_deep_sleep();
            else:
              - lambda: |-
                  ESP_LOGI("Apollo", "Deep sleep opted in - enabling automatic sleep");
                  id(deep_sleep_1).allow_deep_sleep();
    # Decoding lives in Core.yaml's wake_decoder
    - priority: -100
      then:
        - script.execute: wake_decoder
    - priority: -10
      then:
        - if:
            condition:
              - lambda: "return id(runTest);"
            then:
              - script.execute: testScript
    # Re-apply Bluetooth Proxy switch after setup
    - priority: -300
      then:
        - if:
            condition:
              switch.is_on: bluetooth_proxy_switch
            then:
              - esp32_ble_tracker.start_scan:
                  continuous: true
            else:
              - esp32_ble_tracker.stop_scan:
  on_shutdown:
    - light.turn_off: all_lights
    - light.turn_off: body_light
    - light.turn_off: mouth_light
    - light.turn_off: eyes_light
    - light.turn_off: nose_light
    - light.turn_off: hat_light

# Compiled into shipped units; keep this path on main
dashboard_import:
  package_import_url: github://ApolloAutomation/H-3/Integrations/ESPHome/H-3.yaml
  import_full_config: false

deep_sleep:
  sleep_duration: 24h

ota:
  - platform: esphome
    id: ota_esphome
  - platform: http_request
    id: ota_managed

esp32_ble_tracker:
  id: ble_tracker
  # continuous FALSE on purpose; the switch owns scanning
  scan_parameters:
    continuous: false

bluetooth_proxy:
  id: ble_proxy

# Improv over BLE; required for the M4E badge
improv_ble:
  id: ble_improv
  # 'none' = no physical authorization step
  authorizer: none
  status_indicator: improv_status_led

http_request:
  id: http_request_client
  verify_ssl: true
  # Fits GitHub's ~3.6KB CSP redirect header
  buffer_size_rx: 5120
  # Fits GitHub's long signed redirect URL
  buffer_size_tx: 2048

safe_mode:
  id: safe_mode_component

update:
  - platform: http_request
    id: update_http_request
    name: Firmware Update
    # This one really is firmware
    device_class: firmware
    source: ${ota_stable_manifest}

wifi:
  id: wifi_component
  power_save_mode: HIGH
  output_power: 10
  # Keeps today's no-reboot on lost Wi-Fi; 2026.11 drops the AP exemption
  reboot_timeout: 0s
  ap:
    ssid: "Apollo H3 Hotspot"

logger:
  id: logger_component

improv_serial:
  id: serial_improv

captive_portal:
  id: captive_portal_component

web_server:
  id: web_server_component
  port: 80
  version: 3

globals:
  # Short BOOT presses waiting for boot_click_resolve
  - id: boot_clicks
    type: uint8_t
    restore_value: no
    initial_value: "0"

# Drives hat zone; must be a BinaryOutput
output:
  - platform: template
    type: binary
    id: improv_status_led
    write_action:
      # LED checks need all 37 green, and the sleep feedback the whole
      # ornament; the blink resumes on its next toggle
      - if:
          condition:
            lambda: |-
              return !id(testScript).is_running() && !id(lightTest).is_running() &&
                     !id(sleep_mode_feedback).is_running();
          then:
            - if:
                condition:
                  lambda: "return state;"
                then:
                  - light.turn_on:
                      id: hat_light
                      brightness: 60%
                      red: 0%
                      green: 40%
                      blue: 100%
                else:
                  - light.turn_off: hat_light

api:
  id: api_server
  # No key on purpose; M4E forbids baked secrets
  encryption:
  # 'actions' is the current spelling for 'services'
  actions:
    - action: play_buzzer
      variables:
        song_str: string
      then:
        - rtttl.play:
            rtttl: !lambda 'return song_str;'
    - action: play_song_1
      then:
        - script.execute: play_song_1
    - action: play_song_2
      then:
        - script.execute: play_song_2
    - action: play_song_3
      then:
        - script.execute: play_song_3
    - action: play_song_4
      then:
        - script.execute: play_song_4
    - action: play_song_5
      then:
        - script.execute: play_song_5
    - action: play_song_6
      then:
        - script.execute: play_song_6
  reboot_timeout: 0s
  on_client_connected:
    then:
      - delay: 5s
      - if:
          condition:
            or:
              - binary_sensor.is_on: ota_mode
              - switch.is_on: prevent_sleep
          then:
            - lambda: |-
                ESP_LOGW("Apollo", "Preventing Deep Sleep Due To OTA Or Switch");
                id(deep_sleep_1).prevent_deep_sleep();
number:
  # Sets the cap Core.yaml gives all 37 LEDs; H-3D keeps it fixed
  - platform: template
    name: "LED Brightness"
    id: led_brightness
    icon: mdi:brightness-6
    entity_category: "config"
    # Below 25% the gamma curve leaves about one LED level: effects freeze
    min_value: 25
    max_value: 100
    step: 5
    initial_value: ${led_max_brightness}
    unit_of_measurement: "%"
    mode: slider
    optimistic: true
    restore_value: true
    on_value:
      - lambda: |-
          // Also runs at boot, before the lights are set up: only the
          // correction is set then, and lights that are on get redrawn.
          // Zones first, All Lights last, so All Lights stays on top.
          const float cap = x / 100.0f;
          for (auto *light : {id(body_light), id(mouth_light), id(eyes_light),
                              id(nose_light), id(hat_light), id(all_lights)}) {
            auto *out = static_cast<light::AddressableLight *>(light->get_output());
            out->set_correction(cap, cap, cap);
            // Effects and transitions pick it up on their next frame; only a
            // static colour needs a redraw
            if (light->is_ready() && light->current_values.is_on() &&
                !light->is_transitioning()) {
              out->update_state(light);
              out->schedule_show();
            }
          }

select:
  - platform: template
    name: "Firmware Channel"
    id: firmware_channel
    icon: mdi:source-branch
    entity_category: "config"
    optimistic: true
    restore_value: true
    options:
      - "Stable"
      - "Beta"
    initial_option: "Stable"
    on_value:
      then:
        - script.execute: apply_ota_source

button:
  # Renamed: the update: entity already uses that name
  - platform: template
    name: "Reinstall Firmware"
    id: update_firmware
    icon: mdi:cloud-download
    entity_category: "config"
    on_press:
      - logger.log: "Applying firmware update for the selected channel"
      - delay: 3s
      - script.execute: apply_ota_source
      - script.wait: apply_ota_source
      # Give async manifest fetch time to land
      - delay: 5s
      - lambda: id(update_http_request).perform(true);

  # Recovery entities; support asks for these first
  - platform: restart
    name: "Restart"
    id: restart_button
    entity_category: "diagnostic"

  # Skips all component setup for 5 minutes, so it must stay off a dashboard
  - platform: safe_mode
    name: "Restart (Safe Mode)"
    id: safe_mode_button
    entity_category: "diagnostic"
    disabled_by_default: true

switch:
  - platform: template
    name: "Bluetooth Proxy"
    id: bluetooth_proxy_switch
    icon: mdi:bluetooth
    entity_category: "config"
    restore_mode: RESTORE_DEFAULT_OFF
    optimistic: true
    on_turn_on:
      - esp32_ble_tracker.start_scan:
          continuous: true
    on_turn_off:
      - esp32_ble_tracker.stop_scan:

  - platform: template
    name: "Prevent Sleep"
    id: prevent_sleep
    icon: mdi:sleep
    restore_mode: RESTORE_DEFAULT_ON
    optimistic: true
    entity_category: "config"
    on_turn_on:
      then:
        - lambda: |-
            id(deep_sleep_1).prevent_deep_sleep();
    on_turn_off:
      then:
        - if:
            condition:
              binary_sensor.is_off: ota_mode
            then:
              - lambda: |-
                  id(deep_sleep_1).allow_deep_sleep();

binary_sensor:
  - platform: status
    name: Online
    id: ink_ha_connected
  - platform: homeassistant
    name: "OTA Mode"
    id: ota_mode
    # Mirrors an HA helper; never dashboard material
    entity_category: "diagnostic"
    entity_id: input_boolean.apollo_ota_mode
    on_press:
      then:
        - lambda: |-
            id(deep_sleep_1).prevent_deep_sleep();
    on_release:
      then:
        - if:
            condition:
              switch.is_off: prevent_sleep
            then:
              - lambda: |-
                  id(deep_sleep_1).allow_deep_sleep();

sensor:
  - platform: wifi_signal
    name: RSSI
    id: wifi_signal_db
    update_interval: 60s
    entity_category: "diagnostic"
    # WWHA rate limit; ignores a few dBm of jitter
    filters:
      - delta: 5.0

# Wi-Fi diagnostics, disabled by default
text_sensor:
  - platform: wifi_info
    ip_address:
      name: "IP Address"
      id: wifi_ip_address
      entity_category: "diagnostic"
      disabled_by_default: true
    ssid:
      name: "Connected SSID"
      id: wifi_ssid
      entity_category: "diagnostic"
      disabled_by_default: true
    bssid:
      name: "Connected BSSID"
      id: wifi_bssid
      entity_category: "diagnostic"
      disabled_by_default: true
    mac_address:
      name: "MAC Address"
      id: wifi_mac_address
      entity_category: "diagnostic"
      disabled_by_default: true

  - platform: version
    name: "ESPHome Version"
    id: esphome_version
    hide_timestamp: true
    entity_category: "diagnostic"
  - platform: template
    name: "Apollo Firmware Version"
    id: apollo_firmware_version
    update_interval: never
    entity_category: "diagnostic"

script:
  - id: apply_ota_source
    # Set OTA manifest from the channel select
    then:
      - lambda: |-
          const bool beta = id(firmware_channel).current_option() == "Beta";
          const char *url = beta ? "${ota_beta_manifest}" : "${ota_stable_manifest}";
          ESP_LOGI("firmware", "OTA manifest set to: %s", url);
          id(update_http_request).set_source_url(url);
      - component.update: update_http_request

  # 80%, as the light test: readable under the 40% cap
  - id: statusCheck
    then:
      - if:
          condition:
            - lambda: 'return id(ink_ha_connected).state;'
          then:
            - logger.log: "Apollo Automation: Connected To HA"
            - light.turn_on:
                id: body_light
                brightness: 80%
                red: 0%
                green: 0%
                blue: 100%
          else:
            - if:
                condition:
                  - wifi.connected
                then:
                  - logger.log: "Apollo Automation: Connected To Wifi"
                  - light.turn_on:
                      id: body_light
                      brightness: 80%
                      red: 0%
                      green: 100%
                      blue: 0%
                else:
                  - logger.log: "Apollo Automation: Not Connected To Wifi"
                  - light.turn_on:
                      id: body_light
                      brightness: 80%
                      red: 100%
                      green: 100%
                      blue: 0%
      - delay: 5s
      - light.turn_off: body_light
  - id: ShouldSleep
    then:
      - if:
          condition:
            or:
              - binary_sensor.is_on: ota_mode
              - switch.is_on: prevent_sleep
          then:
            - lambda: |-
                ESP_LOGW("Apollo", "Preventing Deep Sleep Due To OTA On Boot");
                id(deep_sleep_1).prevent_deep_sleep();
          else:
            - deep_sleep.enter:
                id: deep_sleep_1
  # Same guards as prevent_sleep on_turn_off
  - id: resumeSleep
    then:
      - if:
          condition:
            and:
              - binary_sensor.is_off: ota_mode
              - switch.is_off: prevent_sleep
          then:
            - lambda: |-
                id(deep_sleep_1).allow_deep_sleep();

  # Short BOOT press from Core.yaml: 1-2 presses = status + light test,
  # 3 or more = toggle Prevent Sleep. Resolved once the presses stop, so a
  # triple press never starts the light test.
  - id: boot_short_press
    then:
      # Under 30ms is contact bounce; GPIO9 has no debounce filter
      - if:
          condition:
            lambda: 'return (millis() - id(button_press_timestamp)) >= 30;'
          then:
            - lambda: 'if (id(boot_clicks) < 255) id(boot_clicks)++;'
            - script.execute: boot_click_resolve

  - id: boot_click_resolve
    # restart: every press pushes the decision back
    mode: restart
    then:
      - delay: ${boot_click_gap}
      - if:
          condition:
            binary_sensor.is_on: reset_button
          then:
            # Still held: a hold, not a click; its release decides
            - lambda: 'id(boot_clicks) = 0;'
          else:
            - if:
                condition:
                  lambda: 'return id(boot_clicks) >= 3;'
                then:
                  - lambda: 'id(boot_clicks) = 0;'
                  - script.execute: toggle_prevent_sleep
                else:
                  - lambda: 'id(boot_clicks) = 0;'
                  # script.wait, not delay(): delay blocks loop()
                  - script.execute: statusCheck
                  - script.wait: statusCheck
                  - script.execute: lightTest

  - id: toggle_prevent_sleep
    then:
      - if:
          condition:
            switch.is_on: prevent_sleep
          then:
            - switch.turn_off: prevent_sleep
            # on_turn_off releases sleep at once, which sleeps instantly once
            # run_duration has passed; give the normal window instead
            - lambda: 'id(deep_sleep_1).prevent_deep_sleep();'
            - script.execute:
                id: sleep_mode_feedback
                awake: false
            - script.execute: sleep_grace_period
          else:
            # on_turn_on blocks sleep
            - switch.turn_on: prevent_sleep
            - script.stop: sleep_grace_period
            - script.execute:
                id: sleep_mode_feedback
                awake: true

  # Whole ornament: white for 3s = stays awake (Prevent Sleep on), purple
  # fading out = sleep allowed. Not red (factory fail), green (LED check)
  # or blue (Improv blink).
  - id: sleep_mode_feedback
    parameters:
      awake: bool
    then:
      - script.stop: statusCheck
      - script.stop: lightTest
      # Clear first: stop fires on_finished_playback, which would sleep
      - lambda: "id(song_active) = false;"
      - rtttl.stop:
      - light.turn_off: all_lights
      - lambda: |-
          for (auto *zone : {id(body_light), id(mouth_light), id(eyes_light), id(nose_light), id(hat_light)}) {
            auto call = zone->turn_on();
            call.set_effect("None");
            call.set_transition_length(0);
            call.set_brightness(0.6f);
            if (awake) {
              call.set_rgb(1.0f, 1.0f, 1.0f);
            } else {
              call.set_rgb(0.6f, 0.0f, 1.0f);
            }
            call.perform();
          }
      - if:
          condition:
            lambda: "return awake;"
          then:
            - delay: 3s
            - script.execute: all_lights_off
          else:
            - delay: 500ms
            - lambda: |-
                for (auto *zone : {id(body_light), id(mouth_light), id(eyes_light), id(nose_light), id(hat_light)}) {
                  auto call = zone->turn_off();
                  call.set_transition_length(2500);
                  call.perform();
                }
            # Running until the fade ends keeps the Improv blink off the hat
            - delay: 2500ms


packages:
  core: !include Core.yaml
