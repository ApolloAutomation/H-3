esphome:
  name: "apollo-h-3"
  friendly_name: Apollo H-3
  comment: Apollo H-3
  name_add_mac_suffix: true
  platformio_options:
    board_build.flash_mode: dio

  project:
    name: "ApolloAutomation.H-3"
    version: "${version}"

  # Hard floor is 2024.6.0 (list-form ota:, http_request update, standalone
  # safe_mode:); tracks the rest of the fleet rather than the true minimum.
  min_version: 2025.11.0
  on_boot:
    # H-3 is opt-in for deep sleep
    - priority: 800
      then:
        - lambda: |-
            id(deep_sleep_1).prevent_deep_sleep();

    # No set_sleep_duration here: Core.yaml's deep_sleep_sleep_duration
    # on_value already converts at boot, and its ${timer_wake_enabled} guard
    # is the one that matters.
    - priority: -100
      then:
        - if:
            condition:
              or:
                - binary_sensor.is_on: ota_mode
                - switch.is_on: prevent_sleep
            then:
              - lambda: |-
                  ESP_LOGW("Apollo", "Deep sleep stays disabled (Prevent Sleep on or OTA mode)");
                  id(deep_sleep_1).prevent_deep_sleep();
            else:
              - lambda: |-
                  ESP_LOGI("Apollo", "Deep sleep opted in - enabling automatic sleep");
                  id(deep_sleep_1).allow_deep_sleep();
    # Decoding lives in Core.yaml's wake_decoder; this block must stay
    - priority: -100
      then:
        - script.execute: wake_decoder
    - priority: -10
      then:
        - if:
            condition:
              - lambda: "return id(runTest);"
            then:
              - script.execute: testScript
    # Re-apply the Bluetooth Proxy switch after all components set up, so BLE
    # scanning matches the switch state restored from flash.
    - priority: -300
      then:
        - if:
            condition:
              switch.is_on: bluetooth_proxy_switch
            then:
              - esp32_ble_tracker.start_scan:
                  continuous: true
            else:
              - esp32_ble_tracker.stop_scan:
  on_shutdown:
    - light.turn_off: body_light
    - light.turn_off: mouth_light
    - light.turn_off: eyes_light
    - light.turn_off: nose_light
    - light.turn_off: hat_light

dashboard_import:
  package_import_url: github://ApolloAutomation/H-3/Integrations/ESPHome/H-3.yaml
  import_full_config: false

deep_sleep:
  sleep_duration: 24h

ota:
  - platform: esphome
    id: ota_esphome
  - platform: http_request
    id: ota_managed

esp32_ble_tracker:
  id: ble_tracker
  scan_parameters:
    continuous: true

bluetooth_proxy:

http_request:
  verify_ssl: true

safe_mode:

update:
  - platform: http_request
    id: firmware_update
    name: Firmware Update
    source: https://apolloautomation.github.io/H-3/firmware/manifest.json

wifi:
  power_save_mode: HIGH
  output_power: 10
  ap:
    ssid: "Apollo H3 Hotspot"

logger:

improv_serial:

captive_portal:

web_server:
  port: 80
  version: 3

api:
  services:
    - service: play_buzzer
      variables:
        song_str: string
      then:
        - rtttl.play:
            rtttl: !lambda 'return song_str;'
    - service: play_song_1
      then:
        - script.execute: play_song_1
    - service: play_song_2
      then:
        - script.execute: play_song_2
    - service: play_song_3
      then:
        - script.execute: play_song_3
    - service: play_song_4
      then:
        - script.execute: play_song_4
    - service: play_song_5
      then:
        - script.execute: play_song_5
  reboot_timeout: 0s
  on_client_connected:
    then:
      - delay: 5s
      - if:
          condition:
            or:
              - binary_sensor.is_on: ota_mode
              - switch.is_on: prevent_sleep
          then:
            - lambda: |-
                ESP_LOGW("Apollo", "Preventing Deep Sleep Due To OTA Or Switch");
                id(deep_sleep_1).prevent_deep_sleep();
switch:
  - platform: template
    name: "Bluetooth Proxy"
    id: bluetooth_proxy_switch
    icon: mdi:bluetooth
    entity_category: "config"
    restore_mode: RESTORE_DEFAULT_OFF
    optimistic: true
    on_turn_on:
      - esp32_ble_tracker.start_scan:
          continuous: true
    on_turn_off:
      - esp32_ble_tracker.stop_scan:

  - platform: template
    name: "Prevent Sleep"
    id: prevent_sleep
    icon: mdi:sleep
    restore_mode: RESTORE_DEFAULT_ON
    optimistic: true
    entity_category: "config"
    on_turn_on:
      then:
        - lambda: |-
            id(deep_sleep_1).prevent_deep_sleep();
    on_turn_off:
      then:
        - if:
            condition:
              binary_sensor.is_off: ota_mode
            then:
              - lambda: |-
                  id(deep_sleep_1).allow_deep_sleep();

binary_sensor:
  - platform: status
    name: Online
    id: ink_ha_connected
  - platform: homeassistant
    name: "OTA Mode"
    id: ota_mode
    entity_id: input_boolean.apollo_ota_mode
    on_press:
      then:
        - lambda: |-
            id(deep_sleep_1).prevent_deep_sleep();
    on_release:
      then:
        - if:
            condition:
              switch.is_off: prevent_sleep
            then:
              - lambda: |-
                  id(deep_sleep_1).allow_deep_sleep();

sensor:
  - platform: wifi_signal
    name: RSSI
    id: wifi_signal_db
    update_interval: 60s
    entity_category: "diagnostic"

script:
  - id: statusCheck
    then:
      - if:
          condition:
            - lambda: 'return id(ink_ha_connected).state;'
          then:
            - logger.log: "Apollo Automation: Connected To HA"
            - light.turn_on:
                id: body_light
                brightness: 40%
                red: 0%
                green: 0%
                blue: 100%
          else:
            - if:
                condition:
                  - wifi.connected
                then:
                  - logger.log: "Apollo Automation: Connected To Wifi"
                  - light.turn_on:
                      id: body_light
                      brightness: 40%
                      red: 0%
                      green: 100%
                      blue: 0%
                else:
                  - logger.log: "Apollo Automation: Not Connected To Wifi"
                  - light.turn_on:
                      id: body_light
                      brightness: 40%
                      red: 100%
                      green: 100%
                      blue: 0%
      - delay: 5s
      - light.turn_off: body_light
  - id: ShouldSleep
    then:
      - if:
          condition:
            or:
              - binary_sensor.is_on: ota_mode
              - switch.is_on: prevent_sleep
          then:
            - lambda: |-
                ESP_LOGW("Apollo", "Preventing Deep Sleep Due To OTA On Boot");
                id(deep_sleep_1).prevent_deep_sleep();
          else:
            - deep_sleep.enter:
                id: deep_sleep_1
  # Same guards as prevent_sleep's on_turn_off. Normally a no-op on H-3.
  - id: resumeSleep
    then:
      - if:
          condition:
            and:
              - binary_sensor.is_off: ota_mode
              - switch.is_off: prevent_sleep
          then:
            - lambda: |-
                id(deep_sleep_1).allow_deep_sleep();


packages:
  core: !include Core.yaml
