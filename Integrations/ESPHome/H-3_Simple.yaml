# ============================================================================
# H-3_Simple.yaml - bench / bring-up firmware for H-3 (no deep sleep, no HA
# dependency). Wifi + captive portal + web server + API + OTA, nothing else.
#
# LED WIRING (this is the reworked build):
#   GPIO3 -> ONE chain of 32 LEDs:  body(24) -> nose(1) -> eyes(2) -> hat(5)
#   GPIO2 -> mouth, 5 LEDs, still its own strip
#
#   The ESP32-C6 has only TWO TX RMT channels. The old config declared five
#   esp32_rmt_led_strip lights, so the last three (eyes/nose/hat) failed at
#   setup with "rmt_tx_wait_all_done(586): invalid argument" and never lit.
#   Two strips = two channels = nothing to run out of.
#
# INDEX MAP into the 32-LED chain (partition from/to are INCLUSIVE):
#   body 0..23   nose 24   eyes 25..26   hat 27..31
#   If a segment lights the wrong LEDs, only these numbers need to change -
#   nothing else in the file cares.
#
# ENTITIES
#   "Whole Face" (led_chain)  - all 32 LEDs as ONE canvas. Run an effect here
#                               and it sweeps body->nose->eyes->hat as a single
#                               continuous animation. This is the "one big
#                               effect" view.
#   "Body/Nose/Eyes/Hat Light" - partition views into that same chain. Same ids
#                               and names as the old separate strips, so the
#                               song scripts and HA entities are unchanged.
#   "Mouth Light"             - the second physical strip on GPIO2.
#
#   Drive EITHER the whole chain OR the partitions at any one time; if both run
#   effects at once they fight over the same pixels and flicker. The song
#   scripts use the partitions; play_song_x demos the whole-chain version.
#
# color_correct is a strip-level setting, so all 32 chain LEDs now share the
# body's 40% (nose/eyes/hat used to be 30% and will look brighter).
#
# Flash (boot mode: hold USR/BOOT, tap RST, release):
#   esphome run H-3_Simple.yaml
# Reattach to logs later:
#   esphome logs H-3_Simple.yaml --device /dev/cu.usbmodem*
#
# debug: prints the RESET REASON at boot and every 60s - that is where a
# brownout from the LED rail shows up.
# ============================================================================

esphome:
  name: "h3-simple"
  friendly_name: H-3 Simple Test
  platformio_options:
    board_build.flash_mode: dio

esp32:
  board: esp32-c6-devkitm-1
  variant: esp32c6
  flash_size: 8MB
  framework:
    type: esp-idf

logger:
  level: DEBUG

# Prints chip info + RESET REASON at boot and every 60s - the brownout proof
# lands here on the boot AFTER a crash.
debug:
  update_interval: 60s

wifi:
  ap:
    ssid: "Apollo H3 Hotspot"

captive_portal:

ota:
  - platform: esphome
    id: ota_esphome

web_server:
  port: 80
  version: 3

api:

switch:
  - platform: factory_reset
    id: factory_reset_switch
    internal: true
  - platform: gpio
    pin: GPIO18
    name: "Accessory Power"
    id: accessory_power
    restore_mode: ALWAYS_ON
    setup_priority: 2000
    internal: true


light:
  # ---- THE PHYSICAL STRIP ------------------------------------------------
  # ONE data line on GPIO3 now drives 32 LEDs, wired in this order:
  #     body(24) -> nose(1) -> eyes(2) -> hat(5)
  # Mouth(5) stays on GPIO2, which is the 2nd (and last) TX RMT channel the
  # ESP32-C6 has. That is the whole point of the rework: 2 strips, 2 channels.
  # Turn "Whole Face" on to run ONE effect across all 32 LEDs as one canvas.
  - platform: esp32_rmt_led_strip
    id: led_chain
    name: "Whole Face"
    pin: GPIO3
    default_transition_length: 0s
    chipset: WS2812
    num_leds: 32
    rgb_order: grb
    rmt_symbols: 96
    color_correct: [40%, 40%, 40%]
    effects: &led_effects
      - pulse:
          name: "Slow Pulse"
          transition_length: 250ms
          update_interval: 250ms
          min_brightness: 50%
          max_brightness: 100%
      - pulse:
          name: "Fast Pulse"
          transition_length: 100ms
          update_interval: 100ms
          min_brightness: 50%
          max_brightness: 100%
      - addressable_lambda:
          name: "RainbowWave"
          update_interval: 100ms  # Controls speed of wave movement
          lambda: |-
            static int start_hue = 0; // Initial hue position

            // Function to convert HSV to RGB
            auto hsv_to_rgb = [](float hue, float saturation, float value) -> Color {
              int h = (int)(hue / 60) % 6;
              float f = hue / 60 - h;
              float p = value * (1 - saturation);
              float q = value * (1 - f * saturation);
              float t = value * (1 - (1 - f) * saturation);

              float r = 0, g = 0, b = 0;
              if (h == 0) { r = value; g = t; b = p; }
              else if (h == 1) { r = q; g = value; b = p; }
              else if (h == 2) { r = p; g = value; b = t; }
              else if (h == 3) { r = p; g = q; b = value; }
              else if (h == 4) { r = t; g = p; b = value; }
              else if (h == 5) { r = value; g = p; b = q; }

              return Color(r * 255, g * 255, b * 255);
            };

            for (int i = 0; i < it.size(); i++) {
              // Calculate the hue for each LED, offset by position and starting hue
              float hue = fmod(start_hue + (i * 10), 360);  // Adjust "10" for wave tightness

              // Convert HSV to RGB and apply it to the LED
              it[i] = hsv_to_rgb(hue, 1.0, 1.0);  // Full saturation and brightness
            }

            // Increment start_hue to create the wave movement
            start_hue = (start_hue + 5) % 360;  // Adjust "5" for wave speed
      - addressable_lambda:
          name: "TwinklingWhite"
          update_interval: 100ms  # Update frequently for subtle brightness changes
          lambda: |-
            for (int i = 0; i < it.size(); i++) {
              // Generate a random brightness factor between 50% and 100%
              float brightness_factor = 0.5 + (rand() % 30) / 75.0;

              // Apply brightness to white color (255, 255, 255) for a twinkle effect
              int white_r = 255 * brightness_factor;
              int white_g = 255 * brightness_factor;
              int white_b = 255 * brightness_factor;

              // Set LED color with adjusted brightness
              it[i] = Color(white_r, white_g, white_b);
            }
      - addressable_lambda:
          name: "RedGreen"
          update_interval: 1000ms  # Switch colors every second
          lambda: |-
            // Keep track of the current color cycle using a flag
            static bool red_green_cycle = true;

            for (int i = 0; i < it.size(); i++) {
              // Alternate between red and green for each LED
              if (i % 2 == 0) {
                if (red_green_cycle) {
                  it[i] = Color(255, 0, 0);  // Red
                } else {
                  it[i] = Color(0, 255, 0);  // Green
                }
              } else {
                if (red_green_cycle) {
                  it[i] = Color(0, 255, 0);  // Green
                } else {
                  it[i] = Color(255, 0, 0);  // Red
                }
              }
            }

            // Switch the color cycle after each update (1 second)
            red_green_cycle = !red_green_cycle;
      - addressable_lambda:
          name: "BlueGold"
          update_interval: 1000ms  # Switch colors every second
          lambda: |-
            // Keep track of the current color cycle using a flag
            static bool blue_gold_cycle = true;

            for (int i = 0; i < it.size(); i++) {
              // Alternate between blue and gold for each LED
              if (i % 2 == 0) {
                if (blue_gold_cycle) {
                  it[i] = Color(0, 100, 255);  // Blue
                } else {
                  it[i] = Color(255, 215, 0);  // Gold
                }
              } else {
                if (blue_gold_cycle) {
                  it[i] = Color(255, 215, 0);  // Gold
                } else {
                  it[i] = Color(0, 100, 255);  // Blue
                }
              }
            }

            // Switch the color cycle after each update (1 second)
            blue_gold_cycle = !blue_gold_cycle;
      - addressable_lambda:
          name: "Sandstorm"
          update_interval: 20ms  # Very fast updates for rave effect
          lambda: |-
            const float PI = 3.14159265359;
            static int phase = 0;
            static int strobe_counter = 0;
            static int color_shift = 0;

            // Define rave colors - bright and vibrant
            static Color rave_colors[6] = {
              Color(255, 0, 0),    // Red
              Color(0, 0, 255),    // Blue
              Color(0, 255, 0),    // Green
              Color(255, 255, 0),  // Yellow
              Color(255, 0, 255),  // Magenta
              Color(0, 255, 255)   // Cyan
            };

            // BPM calculations - Sandstorm is ~138 BPM
            // 138 BPM = 2.3 beats per second = ~435ms per beat
            // Each update is 20ms, so ~22 updates per beat

            strobe_counter++;

            // Create strobing effect every few updates
            bool strobe_on = (strobe_counter % 3) != 0;  // Off 1/3 of the time for strobe

            // Rapid color changes
            if (strobe_counter % 5 == 0) {  // Change colors every 100ms
              color_shift = (color_shift + 1) % 6;
            }

            // Phase shift for wave effects
            phase = (phase + 15) % 360;  // Very fast phase movement

            for (int i = 0; i < it.size(); i++) {
              if (!strobe_on) {
                // Strobe off - black
                it[i] = Color(0, 0, 0);
              } else {
                // Calculate position-based effects
                float position_factor = (float)i / it.size();
                int wave_offset = (int)(position_factor * 180);

                // Pulsing intensity based on sine wave
                float intensity = 0.5 + 0.5 * sin((phase + wave_offset) * PI / 180);

                // Select color based on position and time
                int color_index = (color_shift + (i % 3)) % 6;
                Color base_color = rave_colors[color_index];

                // Random sparkle effect
                if (rand() % 100 < 10) {  // 10% chance of max brightness sparkle
                  intensity = 1.0;
                }

                // Apply intensity to color
                it[i] = Color(
                  base_color.r * intensity,
                  base_color.g * intensity,
                  base_color.b * intensity
                );
              }
            }

            // Reset strobe counter to stay in sync
            if (strobe_counter >= 22) {  // ~1 beat
              strobe_counter = 0;
            }
      - addressable_lambda:
          name: "TwinklingRed"
          update_interval: 100ms  # Update frequently for subtle brightness changes
          lambda: |-
            for (int i = 0; i < it.size(); i++) {
              // Generate a random brightness factor between 30% and 100%
              float brightness_factor = 0.3 + (rand() % 70) / 100.0;

              // Apply brightness to red color (255, 0, 0) for Rudolph's nose twinkle effect
              int red_value = 255 * brightness_factor;

              // Set LED color with adjusted brightness - pure red
              it[i] = Color(red_value, 0, 0);
            }
      - addressable_lambda:
          name: "TwinklingBlues"
          update_interval: 150ms  # Slower update for more mellow blue effect
          lambda: |-
            for (int i = 0; i < it.size(); i++) {
              // Generate random values for different shades of blue
              float brightness = 0.4 + (rand() % 60) / 100.0; // 40% to 100% brightness
              int shade_variation = rand() % 4; // 4 different blue shades

              int red_val = 0;
              int green_val = 0;
              int blue_val = 0;

              switch(shade_variation) {
                case 0: // Deep blue
                  red_val = 0 * brightness;
                  green_val = 50 * brightness;
                  blue_val = 255 * brightness;
                  break;
                case 1: // Sky blue
                  red_val = 135 * brightness;
                  green_val = 206 * brightness;
                  blue_val = 235 * brightness;
                  break;
                case 2: // Royal blue
                  red_val = 65 * brightness;
                  green_val = 105 * brightness;
                  blue_val = 225 * brightness;
                  break;
                case 3: // Ice blue
                  red_val = 176 * brightness;
                  green_val = 224 * brightness;
                  blue_val = 230 * brightness;
                  break;
              }

              it[i] = Color(red_val, green_val, blue_val);
            }

  # ---- SEGMENT VIEWS into the chain (from/to are INCLUSIVE) --------------
  # Same ids and names as the old separate strips, so every script and every
  # Home Assistant entity keeps working untouched. color_correct lives on the
  # chain only - adding it here too would apply the correction twice.
  - platform: partition
    id: body_light
    name: "Body Light"
    default_transition_length: 0s
    segments:
      - { id: led_chain, from: 0, to: 23 }
    effects: *led_effects

  - platform: partition
    id: nose_light
    name: "Nose Light"
    default_transition_length: 0s
    segments:
      - { id: led_chain, from: 24, to: 24 }
    effects: *led_effects

  - platform: partition
    id: eyes_light
    name: "Eyes Light"
    default_transition_length: 0s
    segments:
      - { id: led_chain, from: 25, to: 26 }
    effects: *led_effects

  - platform: partition
    id: hat_light
    name: "Hat Light"
    default_transition_length: 0s
    segments:
      - { id: led_chain, from: 27, to: 31 }
    effects: *led_effects


  - platform: esp32_rmt_led_strip
    id: mouth_light
    name: "Mouth Light"
    pin: GPIO2
    default_transition_length: 0s
    chipset: WS2812
    num_leds: 5
    rgb_order: grb
    rmt_symbols: 48
    color_correct: [30%, 30%, 30%]
    effects: *led_effects


binary_sensor:
  - platform: gpio
    id: back_button_1
    pin:
      number: GPIO4
      mode:
        input: true
        pulldown: true
      #allow_other_uses: true
    name: "Song Button 1"
    on_release:
      then:
        - script.execute: play_song_1

  - platform: gpio
    id: back_button_2
    pin:
      number: GPIO5
      mode:
        input: true
        pulldown: true
      #allow_other_uses: true
    name: "Song Button 2"
    on_release:
      then:
        - script.execute: play_song_2

  - platform: gpio
    id: back_button_3
    pin:
      number: GPIO7
      mode:
        input: true
        pulldown: true
      #allow_other_uses: true
    name: "Song Button 3"
    on_multi_click:
    - timing:
        - ON for at most 1s
        - OFF for at most 1s
        - ON for at most 1s
        - OFF for at least 0.2s
      then:
        - script.execute: play_song_4
    - timing:
        - ON for at most 1s
        - OFF for at least 0.5s
      then:
        - script.execute: play_song_3

script:
  - id: all_lights_off
    then:
      - light.turn_off: led_chain
      - light.turn_off: body_light
      - light.turn_off: mouth_light
      - light.turn_off: eyes_light
      - light.turn_off: nose_light
      - light.turn_off: hat_light

  - id: play_song_1
    then:
      - light.turn_on:
          brightness: 80%
          id: body_light
          effect: "RainbowWave"
      - light.turn_on:
          brightness: 80%
          id: mouth_light
          effect: "RainbowWave"
      - light.turn_on:
          brightness: 80%
          id: eyes_light
          effect: "RainbowWave"
      - light.turn_on:
          brightness: 80%
          id: nose_light
          effect: "RainbowWave"
      - light.turn_on:
          brightness: 80%
          id: hat_light
          effect: "RainbowWave"
      #- rtttl.play:
      #    rtttl: !lambda 'return id(song_1).state;'
      - delay: 30s
      - script.execute: all_lights_off
      #- script.execute: ShouldSleep

  - id: play_song_2
    then:
      - light.turn_on:
          brightness: 80%
          id: body_light
          effect: "TwinklingWhite"
      - light.turn_on:
          brightness: 80%
          id: mouth_light
          effect: "TwinklingWhite"
      - light.turn_on:
          brightness: 80%
          id: eyes_light
          effect: "TwinklingWhite"
      - light.turn_on:
          brightness: 80%
          id: nose_light
          effect: "TwinklingRed"
      - light.turn_on:
          brightness: 80%
          id: hat_light
          effect: "TwinklingWhite"
      #- rtttl.play:
      #    rtttl: !lambda 'return id(song_2).state;'
      - delay: 30s
      - script.execute: all_lights_off
      #- script.execute: ShouldSleep

  - id: play_song_3
    then:
      - light.turn_on:
          brightness: 80%
          id: body_light
          effect: "RedGreen"
      - light.turn_on:
          brightness: 80%
          id: mouth_light
          effect: "RedGreen"
      - light.turn_on:
          brightness: 80%
          id: eyes_light
          effect: "RedGreen"
      - light.turn_on:
          brightness: 80%
          id: nose_light
          effect: "RedGreen"
      - light.turn_on:
          brightness: 80%
          id: hat_light
          effect: "RedGreen"
      #- rtttl.play:
      #    rtttl: !lambda 'return id(song_3).state;'
      - delay: 30s
      - script.execute: all_lights_off
      #- script.execute: ShouldSleep

  - id: play_song_4
    then:
      - light.turn_on:
          brightness: 80%
          id: body_light
          effect: "TwinklingBlues"
      - light.turn_on:
          brightness: 80%
          id: mouth_light
          effect: "TwinklingBlues"
      - light.turn_on:
          brightness: 80%
          id: eyes_light
          effect: "TwinklingBlues"
      - light.turn_on:
          brightness: 80%
          id: nose_light
          effect: "TwinklingBlues"
      - light.turn_on:
          brightness: 80%
          id: hat_light
          effect: "TwinklingBlues"
      #- rtttl.play:
      #    rtttl: !lambda 'return id(song_4).state;'
      - delay: 30s
      - script.execute: all_lights_off
      #- script.execute: ShouldSleep

  - id: play_song_x
    then:
      # ONE BIG EFFECT demo: Sandstorm runs across all 32 chain LEDs as a
      # single canvas instead of four independent copies of itself.
      - light.turn_on:
          brightness: 80%
          id: led_chain
          effect: "Sandstorm"
      - light.turn_on:
          brightness: 80%
          id: mouth_light
          effect: "Sandstorm"
      #- rtttl.play:
          #rtttl: Sandstorm:d=16,o=6,b=85:e,e,e,e,8e,e,e,a,a,a,a,g,g,g,d,e,e,e,e, 8e,e,a,e,e,e,e,8e,e,d,e,e,e,e,e,8e,e,e,a,a,a,a,g,g,g,d,e,e,e,e,8e,e, a,e,e,e,e,8e,e,d,e,e,e,e,e,8e,e,e,a,a,a,a,g,g,g,d,e,e,e,e,8e,e,a,e, e,e,e,8e,e,d,e
      - delay: 30s
      - script.execute: all_lights_off
      #- script.execute: ShouldSleep

  - id: testScript
    then:
      #- lambda: "id(runTest) = false;"
      - light.turn_on:
          id: body_light
          brightness: 80%
          red: 0%
          green: 100%
          blue: 0%
      - light.turn_on:
          id: mouth_light
          brightness: 80%
          red: 0%
          green: 100%
          blue: 0%
      - light.turn_on:
          id: eyes_light
          brightness: 80%
          red: 0%
          green: 100%
          blue: 0%
      - light.turn_on:
          id: nose_light
          brightness: 80%
          red: 0%
          green: 100%
          blue: 0%
      - light.turn_on:
          id: hat_light
          brightness: 80%
          red: 0%
          green: 100%
          blue: 0%
      - delay: 5s
      - script.execute: all_lights_off
